<!DOCTYPE html>
<html><head><title>Kadir Basan — Quotes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;font-family:-apple-system,'Helvetica Neue',sans-serif}
.swiper{width:100%;height:100%;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 32px}
.quote{color:#f0f0f5;font-size:22px;line-height:1.6;font-weight:400;text-align:center;max-width:600px;overflow:auto;max-height:100%}
.dots{position:fixed;bottom:60px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#f0f0f5;width:24px;border-radius:4px}
.count{position:fixed;top:50px;right:24px;color:rgba(255,255,255,.25);font-size:14px;font-weight:500;z-index:10}
.btn{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#f0f0f5;font-size:20px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.teleprompter{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#0f0f1a;display:none;overflow:hidden;padding:40px 20%}
.teleprompter.active{display:flex;align-items:center}
.t-text{color:#f0f0f5;font-size:26px;line-height:1.7;font-weight:400;text-align:center;animation:scroll 30s linear infinite}
.back{position:fixed;top:20px;left:20px;z-index:30;background:rgba(255,255,255,.1);border:none;color:#f0f0f5;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
</style></head>
<body>
<div class="swiper" id="swiper">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
</div>
<button class="btn" id="tp" onclick="toggleTP()">\u25B6</button>
<div class="teleprompter" id="tp-view">
  <button class="back" onclick="toggleTP()">✕ Done</button>
  <div class="t-text" id="tp-text"></div>
</div>
<script>
const q=[{"text": "Allah'ım; bizlere helalinden, temiz ve bereketli rızık nasip eyle. Kazancımıza bereket, evimize huzur, gönlümüze ferahlık ver. Bizi haramdan uzaklaştır, helalinle yetinmeyi nasip eyle. Âmin. Rızık sadece mal ve para değildir; sağlık, huzur, aile, zaman ve gönül zenginliği de büyük bir nimettir", "likes": 16}, {"text": "Ya Rabbi, bu sabaha Senin rahmetinle uyanmayı, günümüzü Senin rızana uygun yaşamayı nasip eyle. Kalplerimize huzur, işlerimize bereket, yollarımıza hayır ver.* *Yâ Fettâh, hayır kapılarını aç; Yâ Rezzâk, helâl rızıklarla gönüllerimizi ferahlat; Yâ Hafîz, bizi ve sevdiklerimizi her türlü kötülükten muhafaza eyle. Günümüzü günlerin en hayırlılarından eyle.", "likes": 16}, {"text": "İHLASLI OLUNUZ! Her İşinizi Allah Rızası İçin Yapın Dostlarım, ihlaslı olunuz. Her işinizi Allah rızası için yaparsanız kurtulursunuz. İhlassız yapılan amel, üzerinde padişahın mührü bulunmayan sahte para gibidir. Rabbim bütün amellerimizi ihlasla yapmayı ve yalnızca kendi rızasını gözetmeyi nasip eylesin. Amin.", "likes": 14}, {"text": "Bismillahirrahmanirrahim -Vema tevfîkî illâ billâh (Başarım ancak Allah'ın yardımı iledir) ayetini dua niyetine, sayı tutmadan vird şeklinde zikrediyoruz Burada niyetimizi sağlam tutup, bu virdi -herhangi bir adet saymadan, -kalbimize geldiği zaman, -kalbimize geldiği kadar ve, -samimiyet ile yapmamız çok önemli.", "likes": 10}, {"text": "MEVLİD KANDİLİ: 24 AĞUSTOS… Bu tarihe kadar dilinden düşürme… 7 Esmâ, 11 tekrar. Mevlid Kandili’ne yaklaşırken gönlümüzü güzel bir zikirle buluşturalım. Her gece 11 defa: Yâ Allah • Yâ Melik • Yâ Azîz • Yâ Gaffâr • Yâ Kebîr • Yâ Evvel • Yâ Âhir Ardından ellerimizi açıp, kalbimizde ne varsa Rabbimize bırakalım… Allah’ım; gönlünde taşıdığı yükü Sen’den başka kimsenin bilmediği kullarına ferahlık ver. Geceleri sessizce ağlayanların gözyaşlarını sevince çevir. Hastalara şifa, dertlilere deva, borçlulara kolaylık, rızık bekleyenlere bereket, evlatları için dua eden anne-babalara hayırlı haberler nasip eyle. Ve bu duanın altına “ÂMİN” diyecek olan kardeşim… Rabbim senin kalbinden geçen ve kimseye söyleyemediğin o duayı da kabul etsin. Beklediğin kapıyı hayırla açsın, “artık olmaz” dediğin yerde sana bir çıkış yolu göstersin. İçindeki sıkıntıyı huzura, gözyaşını sevince, bekleyişini güzel bir habere dönüştürsün. Seni ve sevdiklerini görünür-görünmez her türlü kötülükten muhafaza etsin.", "likes": 13}, {"text": "Hayatın koşuşturmacasında hep bir şeyleri erteliyoruz. \"Yarın başlarım\", \"Sonra yaparım\" derken zaman hızla akıp gidiyor... Oysa İlahi kelam bizi tam da bu noktada uyarıyor: Uyarılar, işaretler ve zamanın akışı zaten gözümüzün önünde. Gerçekle yüzleşmek için son anı beklemek, dönüşü olmayan bir pişmanlıktan başka ne getirir? Vakit henüz varken, kalbimizi ve yönümüzü hakikate dönmek dileğiyle...", "likes": 9}, {"text": "Kur’an-ı Kerim, sadece seslendirilmeyi bekleyen bir metin ya da raflarda saklanacak mukaddes bir mushaf değil; kalbimize dokunan, adımlarımıza yön veren ve bakışımızı güzelleştiren canlı bir rehberdir. Bizler çoğu zaman ayetleri hızlıca okuyup geçme veya sadece dilimizle telaffuz etme kolaylığına kaçabiliyoruz. Oysa ilahi kelamın asıl mucizesi; bir insanın ahlakında, üslubunda, komşuluk ilişkisinde, merhametinde ve ticari dürüstlüğünde tecelli ettiğinde ortaya çıkar. Peki, Kur’an-ı Kerim’i hayatımızın merkezine koymak ve onu yaşantımıza yansıtmak pratikte ne anlama gelir? Sözümüzde Yansımalıdır: \"İnsanlara güzel söz söyleyin\" ayetini okuduğumuzda; üslubumuzdaki kırıcı tonu, öfkeyi ve gıybeti hayatımızdan temizlemek demektir. Sabrımızda Yansımalıdır: İmtihanlarla karşılaştığımızda \"Şüphesiz Allah sabredenlerle beraberdir\" şuurunu hatırlayıp panik yerine sükûnete ve tevekküle sığınabilmektir. Adaletimizde Yansımalıdır: \"Kendi aleyhinize de olsa adaleti ayakta tutun\" ilahi emrini, günlük işlerimizde, ticaretimizde ve ailemizde tavizsiz uygulayabilmektir. Merhametimizde Yansımalıdır: Yeryüzündeki tüm canlılara, kırılmış bir kalbe veya yardıma muhtaç bir cana Rahman’ın merhamet nazarıyla bakabilmektir. Her ayet, doğrudan ruhumuza yazılmış kişiye özel bir mektuptur. O mektubu açıp okumak kıymetli bir ilk adımdır; fakat hayatın hengamesi içinde o öğütle durulmak, o ışıkla karar vermek ve adımlarımızı o ölçüye göre atmak asıl gayedir. Kalbimizi Kur’an’ın aynası kıldığımızda, etrafımıza yayacağımız huzur da ilahi merhametin bir yansıması olacaktır. Bugün bir ayeti sırf okumakla kalmayalım; onu duruşumuza, niyetimize, tebessümümüze ve bir insanın hayatına dokunuşumuza nakşedelim.", "likes": 7}, {"text": "Bazen yardım en beklenmedik yerlerden gelir.", "likes": 26}, {"text": "Bu uygulamayı kaydet; niyet ettiğinde tekrar ihtiyacın olacak. Niyet ve dilekler için kullanılan bu uygulamada en önemli şey, ne istediğini net ve temiz bir niyetle belirlemek. Kimsenin zararına olacak bir dilek yazma. UYGULAMA 1. Daha önce kullanılmamış temiz bir kâğıt al. 2. Aşağıdaki duayı kâğıda 7 kez yaz: “Hasbiyallâhü lâ ilâhe illâ hû. Hasbünallâhu ve ni’mel vekîl. İyyâke na’büdü ve iyyâke nestaîn. Velhamdülillâhi rabbil âlemîn.” 3. Altına gerçekleşmesini istediğin tek ve net niyetini yaz. Örneğin: “Hayatıma benim için hayırlı, bereketli ve güzel fırsatların gelmesine niyet ediyorum.” 4. Niyetinin hemen altına, sana o dileği hatırlatan küçük bir sembol veya şekil çiz. △ 5. En alta ismini ve anne ismini yaz. Böylece niyetini mühürlemiş ol. Niyetimiz hazır. Kâğıdı 3 kez katla ve 3 gün boyunca kimsenin dokunmayacağı bir yerde sakla. 3. gün kâğıdı çıkar, bir bardak temiz suda ıslat ve ardından temiz bir toprağa göm. Bunu yaparken içinden: “Ben niyetimi sevgiyle bırakıyorum. Benim için hayırlı olan, en doğru zamanda ve en güzel şekilde hayatıma gelsin.” de ve sonucu zorlamadan bırak. Uygulamayı kaydetmeyi unutma. Beğenip ihtiyacı olan birine gönder. Yapanlar niyetini değil, “Niyetimi aldım, kabul ettim.” yazsın. Bu uygulama manevi/kişis", "likes": 11}, {"text": "Hakk’a teslim ol. Hakk’a teslim olan, sakin ve emin olur. Bu dünya bir dağ gibidir, ona nasıl seslenirsen sana öyle aksettirir. Ağzından hayırlı bir söz çıksın ki dağdan sana hayırlı bir ses dönsün...\" der Şems. Şems-i Tebrizi Bu Kuralda Ne Demek İstiyor? 34. Kural, bizlere hayatın akışına ve ilahi takdire teslim olmanın getirdiği o derin iç huzurunu hazrettirir. İnsan çoğu zaman kontrolü elinde tutmak ister; işlerin, planların veya hayatın altüst olmasından korkar. Oysa Şems bize hatırlatır ki: \"Hayatımın altı üstüne gelir diye endişe etme. Nereden biliyorsun hayatın altının üstünden daha iyi olmayacağını?\" Hayata ne verirsek bize onu yansıtır; kalbimize teslimiyeti, dilimize güzel sözü yerleştirdiğimizde, hayat da bize o sükûnetle karşılık verir.", "likes": 15}];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
q.forEach((q,j)=>{
  let s=document.createElement('div');s.className='slide';
  let p=document.createElement('div');p.className='quote';p.textContent=q.text;
  s.appendChild(p);track.appendChild(s);
  let d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
function go(n){
  i=Math.max(0,Math.min(n,q.length-1));
  track.style.transform='translateX(-'+(i*100)+'%)';
  dots.querySelectorAll('.dot').forEach((d,j)=>d.className='dot'+(j===i?' active':''));
  count.textContent=(i+1)+'/'+q.length;
}
go(0);
let sx=0,ex=0,swiping=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiping=true});
document.addEventListener('touchmove',e=>{if(!swiping)return;ex=e.touches[0].clientX});
document.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;let d=sx-ex;if(Math.abs(d)>50)go(d>0?i+1:i-1)});
function toggleTP(){
    let v=document.getElementById('tp-view');
    let s=document.getElementById('swiper');
    let t=document.getElementById('tp-text');
    let b=document.getElementById('tp');
    if(v.classList.contains('active')){
        v.classList.remove('active');s.style.display='';b.textContent='\u25B6'
    }else{
        t.textContent=q[i].text;v.classList.add('active');s.style.display='none';b.textContent='\u23F9'
    }
}
</script>
</body></html>
