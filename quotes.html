<!DOCTYPE html>
<html><head><title>Kadir Basan — Quotes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;font-family:-apple-system,'Helvetica Neue',sans-serif}
.swiper{width:100%;height:100%;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 32px}
.quote{color:#f0f0f5;font-size:22px;line-height:1.6;font-weight:400;text-align:center;max-width:600px;overflow:auto;max-height:100%}
.dots{position:fixed;bottom:60px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#f0f0f5;width:24px;border-radius:4px}
.count{position:fixed;top:50px;right:24px;color:rgba(255,255,255,.25);font-size:14px;font-weight:500;z-index:10}
.btn{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#f0f0f5;font-size:20px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.teleprompter{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#0f0f1a;display:none;overflow:hidden;padding:40px 20%}
.teleprompter.active{display:flex;align-items:center}
.t-text{color:#f0f0f5;font-size:26px;line-height:1.7;font-weight:400;text-align:center;animation:scroll 30s linear infinite}
.back{position:fixed;top:20px;left:20px;z-index:30;background:rgba(255,255,255,.1);border:none;color:#f0f0f5;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
</style></head>
<body>
<div class="swiper" id="swiper">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
</div>
<button class="btn" id="tp" onclick="toggleTP()">\u25B6</button>
<div class="teleprompter" id="tp-view">
  <button class="back" onclick="toggleTP()">✕ Done</button>
  <div class="t-text" id="tp-text"></div>
</div>
<script>
const q=[{"text": "Ayetlerin sultanı ayetel kürsi ne zaman okunursa daha makbul olur Ayetel kürsü duası Ayetel Kürsi Arapça Okunuşu Bismillahirrahmânirrahîm. - Allâhü lâ ilâhe illâ hüvel hayyül kayyûm, lâ te'huzühu sinetün velâ nevm, - lehu mâ fissemâvâti ve ma fil'ard, men zellezi yeşfeu indehu illâ bi'iznih, - ya'lemü mâ beyne eydiyhim vemâ halfehüm, - velâ yü-hîtûne bi'şey'im min ilmihî illâ bima şâe vesia kürsiyyühüssemâvâti vel'ard, - velâ yeûdühû hıfzuhümâ ve hüvel aliyyül azim. Ayetel Kürsi Türkçe Anlamı Rahmân ve Rahîm olan Allah'ın adıyla. Allah'tan başka hiçbir İlah yoktur. O, daima yaşayan, daima duran, bütün varlıkları ayakta tutandır. O'nu ne gaflet basar, ne de uyku. Göklerdeki ve yerdeki herşey O'nundur. O'nun izni olmadan huzurunda şefaat etmek kimin haddine! Onların önlerinde ve arkalarında ne varsa hepsini bilir. Onlar ise, O'nun dilediği kadarından başka ilminden hiçbir şey kavrayamazlar. O'nun hükümdarlığı, bütün gökleri ve yeri kucaklamıştır. Her ikisini görüp gözetmek, ona bir ağırlık da vermez. O, çok yüce, çok büyüktür.", "likes": 8}, {"text": "Canı yanan sabreder, hesabı ise yalnız Allah görür. Kırıldığın yerden susmak acizlik değil, davayı en adil olan Mahkeme-i Kübra’ya havale etmektir.", "likes": 11}, {"text": "Şunu unutmayın kaybedtiginiz her şeyin yerine daha iyisi gelecektir Allahın izninle .", "likes": 22}, {"text": "Nasip sana ait olandır vakti gelince gelir Allahın izninle.", "likes": 24}, {"text": "Allah’ın kabul edeceği tövbe, ancak bilmeden kötülük edip de sonra tez elden pişmanlık getirenlerin tövbesidir; işte Allah bunların tövbesini kabul eder; Allah her şeyi bilendir, hikmet sahibidir. Yoksa kötülükleri yapıp yapıp da içlerinden birine ölüm gelip çattığında “Ben şimdi tövbe ettim” diyenlerle kâfir olarak ölenler için kabul edilecek tövbe yoktur. Onlar için acı bir azap hazırlamışızdır. Nisâ 17-18 .", "likes": 8}, {"text": "Size ilk öncelikli olarak Çarşamba gününü ve o özel vakti vurgulayan bir hikaye aktarmak istiyorum. Hendek Savaşı’nın o en zorlu, çetin ve darlık zamanlarında Peygamber Efendimiz (s.a.v) Çarşamba günü ikindiye doğru ellerini semaya açıp samimiyetle dua etti. Çok geçmeden mübarek yüzünde huzur dolu bir tebessüm belirdi; çünkü duasının kabul olduğu kendisine müjdelenmişti. Ashab-ı Kiram da bu mübarek vaktin bereketine bizzat şahit oldu. Bu Özel Vakitte Ne Yapılmalı? Çarşamba günü ikindi ezanına 30-45 dakika kala bu mübarek zaman dilimini niyetlenip şu tertiple değerlendirebilirsiniz: En az 7 Elhamdülillah, 7 Besmele-i Şerife, 7 Salavat-ı Şerife ve 7 İstiğfar-ı Şerife okuyun. Ardından 1 Fatiha ve 3 İhlas Suresi okuyup Peygamber Efendimiz'in, ashabının ve evliya kulların ruhlarına hediye edin. Kalpten gelen tüm samimiyetinizle hacetinizi, duanızı isteyin. Son olarak duanızı yine 3 veya 7 defa Salavat-ı Şerife okuyarak mühürleyin. İnanmanın ve Niyetin Önemi Bir duanın kapıları açmasındaki en büyük sır, kalpteki tam teslimiyet ve sarsılmaz inançtır. \"Acaba kabul olur mu?\" şüphesiyle değil, Rabbimizin sonsuz rahmetine ve duaları işittiğine yürekten inanarak ellerimizi açmalıyız. İnanarak, samimiyetle yapılan hiçbir dua karşılıksız kalmaz; vakti geldiğinde en güzel şekilde tecelli eder, biiznillah.", "likes": 14}, {"text": "Kim Allah için takva sahibi olursa, Allah ona bir çıkış yolu nasip eder. Ve Allah, ona ummadığı yerden rızık verir. Kim Allah'a güvenirse, O, ona yeter…", "likes": 17}, {"text": "Tarihte bir ilk Kabenin önünde ağlayarak dua eden pakistanlı temizlik işçisi’nin duası akşam olmadan kabul oldu Ailesinin ve kendisinin tüm borçları ödendi . Peki pakistanlı işçi hangi dua ile dua etti işte. O mucizevi dua: Allahümme inni es’elüke min fadlike ve rahmetike fe innehu lâ yemlikühe illâ ente اللهم ان اسألك من فضلك ورحمتك فانه لايملكها الا انت", "likes": 22}, {"text": "Bismillahirrahmanirrahîm Nazara karşı okuyacagınız ayet \"Ve in yekâdullezîne keferû le yuzlikûneke bi ebsârihim lemmâ semiûz zikra ve yekûlûne innehu le mecnûn. Ve mâ huve illâ zikrun lil âlemîn.\" Kalem suresi 51 52 .ayet. بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ بِاَبْصَارِهِمْ لَمَّا سَمِعُوا الذِّكْرَ وَيَقُولُونَ اِنَّهُ لَمَجْنُونٌۢ ﴿٥١﴾ وَمَا هُوَ اِلَّا ذِكْرٌ لِلْعَالَم۪ينَ ﴿٥٢﴾ 51. Ayet: O inkârcılar Kur'an'ı işittikleri zaman, seni gözleriyle devireceklermiş gibi bakar, “Şüphe yok o bir delidir” derler. 52. Ayet: Oysa Kur'an, âlemler için öğütten başka bir şey değildir.", "likes": 16}, {"text": "Hayatında işlerin ters gittiği, rızık kapılarının kapandığı veya mahkeme, ticaret, evlilik gibi konularda düğümlerin oluştuğu dönemlerde okunduğunda, işlerin hayırla çözülmesine vesile olduğu bilinir. Bismillahirrahmânirrahîm. Allahümme inni es’elüke bi sırrı zatike ve bi zat-i sırrık. Hüve ente ve ente hüve. İhtecebtü bi nurillah, ve bi nuri arşillah, ve bi külli ismin lillah, min aduvvi ve aduvvillah. Bi mieti elfi lâ havle velâ kuvvete illâ billâhil aliyyil azîm. Hatemtü alâ nefsî ve alâ ehlî ve alâ mâ meleketühû yedî bi hâtemillâhil kuddûsillezî hateme bihî aktâres semâvâti vel ard. Hasbünallâhü ve ni'mel vekîl, ni'mel mevlâ ve ni'men nasîr. Ve lâ havle velâ kuvvete illâ billâhil aliyyil azîm. Ve sallallâhü alâ seyyidinâ Muhammedin ve alâ âlihî ve sahbihî ve selleme teslîmen kesîrâ. Duanın temiz bir beden ve mekanla, abdestli olarak kıbleye dönülerek okunması faziletini artırır. İmkan varsa duadan önce 2 veya 4 rekat hacet namazı kılmak, arkasından tövbe-istigfar ve Peygamber Efendimiz'e sav. salavat getirmek duanın kabulünü kolaylaştırır. Belirli bir sayı şart olmamakla birlikte, halis bir kalple 3 veya 7 defa okunması tavsiye edilir. el-Evradü'l-Üsbûiyye", "likes": 13}];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
q.forEach((q,j)=>{
  let s=document.createElement('div');s.className='slide';
  let p=document.createElement('div');p.className='quote';p.textContent=q.text;
  s.appendChild(p);track.appendChild(s);
  let d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
function go(n){
  i=Math.max(0,Math.min(n,q.length-1));
  track.style.transform='translateX(-'+(i*100)+'%)';
  dots.querySelectorAll('.dot').forEach((d,j)=>d.className='dot'+(j===i?' active':''));
  count.textContent=(i+1)+'/'+q.length;
}
go(0);
let sx=0,ex=0,swiping=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiping=true});
document.addEventListener('touchmove',e=>{if(!swiping)return;ex=e.touches[0].clientX});
document.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;let d=sx-ex;if(Math.abs(d)>50)go(d>0?i+1:i-1)});
function toggleTP(){
    let v=document.getElementById('tp-view');
    let s=document.getElementById('swiper');
    let t=document.getElementById('tp-text');
    let b=document.getElementById('tp');
    if(v.classList.contains('active')){
        v.classList.remove('active');s.style.display='';b.textContent='\u25B6'
    }else{
        t.textContent=q[i].text;v.classList.add('active');s.style.display='none';b.textContent='\u23F9'
    }
}
</script>
</body></html>
