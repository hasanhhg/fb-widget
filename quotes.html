<!DOCTYPE html>
<html><head><title>Kadir Basan — Quotes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;font-family:-apple-system,'Helvetica Neue',sans-serif}
.swiper{width:100%;height:100%;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 32px}
.quote{color:#f0f0f5;font-size:22px;line-height:1.6;font-weight:400;text-align:center;max-width:600px;overflow:auto;max-height:100%}
.dots{position:fixed;bottom:60px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#f0f0f5;width:24px;border-radius:4px}
.count{position:fixed;top:50px;right:24px;color:rgba(255,255,255,.25);font-size:14px;font-weight:500;z-index:10}
.btn{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#f0f0f5;font-size:20px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.teleprompter{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#0f0f1a;display:none;overflow:hidden;padding:40px 20%}
.teleprompter.active{display:flex;align-items:center}
.t-text{color:#f0f0f5;font-size:26px;line-height:1.7;font-weight:400;text-align:center;animation:scroll 30s linear infinite}
.back{position:fixed;top:20px;left:20px;z-index:30;background:rgba(255,255,255,.1);border:none;color:#f0f0f5;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
</style></head>
<body>
<div class="swiper" id="swiper">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
</div>
<button class="btn" id="tp" onclick="toggleTP()">\u25B6</button>
<div class="teleprompter" id="tp-view">
  <button class="back" onclick="toggleTP()">✕ Done</button>
  <div class="t-text" id="tp-text"></div>
</div>
<script>
const q=[{"text": "Rızık darlığı,işleri bozuk olan,borçlu olanlar,kısmetin açılması,hayırlı dileği olan kimseler her gün kendi yada bir kaç kişi ile beraber (41) Yasin süresi ve her 10 okumadan sonra yada 41 okumanın sonunda bir kere aşağıdaki duayı okursa,bir haftadan evvel işleri yoluna girer ve ne dileği varsa olur.Rızkı bollaşır,kısmeti ayağına gelir. Okunacak dua: “Bismillâhirrahmanirrahim.Allâhümme in kâne rızki fiz semai feenzil hü,ve in kâne fil ardi feahrichü ve in kâne fil bahri featli’hü,ve in kâne baiden fekarribhü,ve in kâne kariben feyessirhü, ve in kane kalilen fekessirhü,ve in kâne kesiren fehevvinhü ve bârikli fihi ver zukni min haysü ahtesibü ve min haysü lâ ahtesibü rızkan hâlâlen tayyiben gadaken,sahhan tabekan mübareken fihi hatta lâ tekûne liahadin min halkike aleyye fihi minnetün vec’al yedey ulyen bil i’tâli velâ tec’al yedey süfla bil-isti’tai inneke ala külli şey’in kadir.”", "likes": 0}, {"text": "Bu dünyada ne yaparsanız yapın nasıl yasarsanız yaşayın ama kimsenin içindeki yaşama sebebini öldürmeyin ve kimsenin yüregine ömrünün tamamanı kaplayacak derin yaralar bırakmayın bunu birde öte tarafı var ödeyemezsiniz unutmayın", "likes": 0}, {"text": "Aslında İnsanı en çok acıtan şey hayal kırıkları değil. Yaşanması mümkünken yaşamadığı mutluluklardır.", "likes": 0}, {"text": "İLLÂ ALLAH Sen ruhundan nef eyledin Çeşit çeşit şekil giydin Zâhir olan kendin oldun Lâ ilâhe illâ Allah Cümle âlem senin mülkün Cümle mahlûk senin halkın Her varlıktır senin kürsün Lâ ilâhe illâ Allah Gökte değil her yerdesin Her nefeste hep bizdesin Hem tendesin hem cândasın Lâ ilâhe illâ Allah Cümle varlık senden geldi Hep seninle nefes aldı Senden sana akıp gitti Lâ ilâhe illâ Allah Her varlıktan sen zikrettin Fiilinle sen işledin Sıfatınla sen kuşattın Lâ ilâhe illâ Allah Vahdet senin cemâlindir Kesret senin celâlindir Noksansızlık kemâlindir Lâ ilâhe illâ Allah Evvel âhir illâ sensin Zâhir bâtın illâ sensin Bedenlerin zâtı sensin Lâ ilâhe illâ Allah O'ndan geldiğini bilmek, Kendinde O'na şahit olmaktır. Her varlıkta O'na nazar etmek, Başka bir şey görmemektir. O'nu kendinde bulmak ola O'nda fâni olmak ola Her yerde cemâlini görmek ola Başka bir yüz görmemek ola", "likes": 10}, {"text": "Kaldıramayacağımız yüklerle imtihan olunmadığımız, sevdiklerimizle huzur bulduğumuz bir gün olsun. Amin.", "likes": 12}, {"text": "Allah Sevdiği Kuluna Bela Gönderir mi? | Peygamberimizin Çarpıcı Hadisi Allah’ın sevdiği kuluna bela gönderip göndermeyeceği ve sıkıntıların mümin için ne ifade ettiği, Peygamber Efendimiz ’in hadislerinde açıklanmaktadır. Sıkıntı, hastalık, üzüntü ve belalar sabırla karşılandığında günahlara kefaret olabilir. Peygamberler ise en ağır imtihanlardan geçirilen kimseler olarak bildirilmiştir. Mümin, nimete şükreder; sıkıntıya sabreder ve her iki durumda da hayır kazanır.", "likes": 12}, {"text": "Allah' tan isteyen, hep galip gelir.. Yeri gelir hemen verir, Yeri gelir sabrını ölçer ve verir, Yeri gelir istediğini vermez ama mutlaka daha iyisini verir, Yeri gelir dünyada vermez bin mislini ahirette verir.. Sen yeter ki \"Allah'ım\" de can-ı gönülden, O üç kere \"buyur kulum\" der. Daha dilinden dökülmeden istekler, O bilir. Ki bize \"kulum\" hitabı Cennetten de güzel değil midir,", "likes": 14}, {"text": "İNSANIN ; Hayrı çoğalırsa Meleklere karışır , Şerri çoğalırsa şeytana karışır,", "likes": 23}, {"text": "Geceleyin öyle bir zaman vardır ki, müslüman bir kimse o zamana rastlayıp Allah’tan dünya ve âhirete dair hayırlı bir şey dilerse, Allah ona dilediğini verir. Bu her gece böyledir.”", "likes": 9}, {"text": "Bir kişi Yâkub -aleyhisselâm-’a: “–Ey kalbi münevver, akıllı peygamber! Yûsuf’un gömleğinin kokusunu Mısır’dan gelirken duydun da, neden yanıbaşındaki kuyuya atılırken onu görmedin?” diye sorar. Yâkub -aleyhisselâm- cevâben: “–Bizim nâil olduğumuz ilâhî nasipler, çakan şimşekler gibidir. Bundan dolayı gerçekler bize bâzen ayân olur, bâzen kapanır!” buyurur. Yani Cenâb-ı Hak perdeyi açarsa kul, öteleri görür; fakat bir de kapatırsa, insan önündeki çukuru bile görmez olur. Yani kul, hangi mânevî makamda olursa olsun âcizdir. Dâimâ Cenâb-ı Hakkʼın lûtfuna muhtaçtır", "likes": 6}];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
q.forEach((q,j)=>{
  let s=document.createElement('div');s.className='slide';
  let p=document.createElement('div');p.className='quote';p.textContent=q.text;
  s.appendChild(p);track.appendChild(s);
  let d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
function go(n){
  i=Math.max(0,Math.min(n,q.length-1));
  track.style.transform='translateX(-'+(i*100)+'%)';
  dots.querySelectorAll('.dot').forEach((d,j)=>d.className='dot'+(j===i?' active':''));
  count.textContent=(i+1)+'/'+q.length;
}
go(0);
let sx=0,ex=0,swiping=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiping=true});
document.addEventListener('touchmove',e=>{if(!swiping)return;ex=e.touches[0].clientX});
document.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;let d=sx-ex;if(Math.abs(d)>50)go(d>0?i+1:i-1)});
function toggleTP(){
    let v=document.getElementById('tp-view');
    let s=document.getElementById('swiper');
    let t=document.getElementById('tp-text');
    let b=document.getElementById('tp');
    if(v.classList.contains('active')){
        v.classList.remove('active');s.style.display='';b.textContent='\u25B6'
    }else{
        t.textContent=q[i].text;v.classList.add('active');s.style.display='none';b.textContent='\u23F9'
    }
}
</script>
</body></html>
