<!DOCTYPE html>
<html><head><title>Kadir Basan — Quotes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;font-family:-apple-system,'Helvetica Neue',sans-serif}
.swiper{width:100%;height:100%;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 32px}
.quote{color:#f0f0f5;font-size:22px;line-height:1.6;font-weight:400;text-align:center;max-width:600px;overflow:auto;max-height:100%}
.dots{position:fixed;bottom:60px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#f0f0f5;width:24px;border-radius:4px}
.count{position:fixed;top:50px;right:24px;color:rgba(255,255,255,.25);font-size:14px;font-weight:500;z-index:10}
.btn{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#f0f0f5;font-size:20px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.teleprompter{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#0f0f1a;display:none;overflow:hidden;padding:40px 20%}
.teleprompter.active{display:flex;align-items:center}
.t-text{color:#f0f0f5;font-size:26px;line-height:1.7;font-weight:400;text-align:center;animation:scroll 30s linear infinite}
.back{position:fixed;top:20px;left:20px;z-index:30;background:rgba(255,255,255,.1);border:none;color:#f0f0f5;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
</style></head>
<body>
<div class="swiper" id="swiper">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
</div>
<button class="btn" id="tp" onclick="toggleTP()">\u25B6</button>
<div class="teleprompter" id="tp-view">
  <button class="back" onclick="toggleTP()">✕ Done</button>
  <div class="t-text" id="tp-text"></div>
</div>
<script>
const q=[{"text": "Hayır amacıyla yapılan harcamalar Allah katında karşılıksız kalmadığı gibi gönül rızasıyla veren kişi bundan ötürü bir kayba da uğramış olmaz; onların yeri Allah Teâlâ tarafından bir şekilde doldurulur. Bu, ya yerine benzeri maddî imkânlar verilmesi ya da bitmez tükenmez bir hazine olan kanaat duygularının geliştirilmesi ve kişinin iç huzurunun arttırılması biçiminde olabilir Sebe suresi 39. Ayet meali", "likes": 9}, {"text": "Bu dünyada bazı güzellikler hemen gelmez ama sabreden gönül bekledigine degen bir gün yaşar yeterki umudunu Rabbine bırak hayırlı sabahlar.", "likes": 11}, {"text": "İyiliğe nereye gidiyorsun demişler, sahibimi rezil rüsva etmeye demiş. Yanlış kişiye ve yanlış yerde yapılan iyilik; İnsana Cehennemi Yaşatır..", "likes": 10}, {"text": "Kalbinizde olup da hiç kimseye anlatmayı başaramadığınız, Dile getirilmesi imkansız bir şey var ya hani, işte Allah onu biliyor, Üzülmeyin. . .", "likes": 7}, {"text": "DERTLERDEN SIKINTILARDAN SELÂMETE ÇIKMAK İÇİN “Ve in yemseskallâhu bidurrin felâ kâşife lehû illâ Hu ve in yüridke bihayrin felâ radde lifadlih, yusıybu bihi men yeşaumin ibadih ve huvel gafûrur rahiym.” “Eğer Allah sana içini daraltacak bir sıkıntı verirse, O’ndan başka feraha çıkartacak yoktur. Bir hayır da dilemişse sana, onu geri çevirecek de yoktur. Kullarından dilediğine fazlını nasib eder. O gafûr ve rahiymdir.” Yunus sûresinin 107. âyeti olan bu metin iç sıkıntısına düşenler, bir derdi sıkıntısı olanlar tarafından günde yüz defa okunursa büyük yarar sağlarlar. Kısa sürede Allah o dertlerinden, sıkıntılarından selâmete çıkartır. Kime böyle Allah’a yönelmek kolaylaştırılırsa, sıkıntıdan kurtulmak da ona yakındır elbet!", "likes": 6}, {"text": "Hani uzaklarda olupta sesi kulagimda,sevgisi yüreğimde , Dualari benimle olan dostlarim varya ben onlari hic UNUTMAM... En güzel gece sabahı olandır , en güçlü sevgi hiç kaybolmayandır... En mutlu insan hatırlanandır, en güzel dostluk ebedi olandir. Hayırlı geceleriniz olsun.", "likes": 16}, {"text": "Babaannem derdi ki: Arkadaşı aç iken çok yemekten bahsedenden Yoklukla yaşayıp sonradan görmelerden Çok kazancı olup ne yapacağını bilemeyen Ne oldum delisi olanlardan Ahiretini düşünmeyen cahillerden uzak dur derdi.. Önemsememistim sanırım haklıymış", "likes": 14}, {"text": "Hiç bir silgi silemeyecek Alnına yazılan yazgıyı Kader deyip susacaksın Bazen kör bazen sağır bazen de lal olacaksın Mutluluk mu o da ne Çok sukur sabırdan geçilmiyor bu yollar.", "likes": 7}, {"text": "Dua (1 Defa Okunur) سُبْحَانَ اللهِ الْعَظِيمِ وَبِحَمْدِهِ، سُبْحَانَ مَنْ يَمُنُّ وَلَا يُمَنُّ عَلَيْهِ، سُبْحَانَ مَنْ يُجِيرُ وَلَا يُجَارُ عَلَيْهِ ، سُبْحَانَ مَنْ يُبْرَأَ مِنَ الْحَوْلِ وَالْقُوَّةِ إِلَيْهِ، سُبْحَانَ مَنِ التَّسْبِيحُ مِئَةٌ مِنْهُ عَلَى مَنِ اعْتَمَدَ عَلَيْهِ، سُبْحَانَ مَنْ يُسَبِّحُ كُلُّ شَيْءٍ بِحَمْدِهِ، سُبْحَانَ كَ لَا إِلَهَ إِلَّا أَنْتَ يَا مَنْ يُسَبِّحُ لَهُ الْجَمِيعُ تَدَارَكْنِي بِعَفْوِكَ فَإِنِّي جَزُوعٌ. Okunuşu: “Sübhanallahi’l-azimi ve bi-hamdih, sübhane men yemünnü ve la yümennü aleyh, sübhane men yüciüru ve la yucarü aleyh, sübhane men yübraü mine’l-havli ve’l-kuvveti ileyh, sübhane meni’t-tesbihu mietün minhü ala meni’temede aleyh, sübhane men yüsebbihu küllü şey’in bi-hamdih, sübhaneke la ilahe illa ente ya men yüsebbihu lehü’l-cemiu tedarakenî bi-afvike fe-innî cezû’.” Anlamı Azim olan Allah’ı hamd ile tesbih ederim. Lütfedip ihsan eden, fakat kendisine lütufta bulunulamayan Zat ne Yücedir! Koruyan, fakat kendisi korumaya muhtaç olmayan Zat ne Yücedir! Bütün güç ve kuvvetten sıyrılıp yalnız O’na sığınılan Zat ne Yücedir! Kendisine güvenip dayananlara lütuf ve ikramı yüz katıyla olan Zat ne Yücedir! Her şeyin hamd ile tesbih ettiği Zat ne Yücedir! Senden başka ilah yoktur, Seni tesbih ederim. Ey kendisini her şeyin tesbih ettiği Zat! Beni affınla kuşat ve bana yetiş, çünkü ben çok sabırsızım.” 2. İstiğfar (100 Defa Okunur) أَسْتَغْفِرُ اللهَ Uygulama Vakti: Sabah namazı ile güneşin doğuşu (işrak vakti) arasındaki o huzurlu zaman", "likes": 17}, {"text": "Olgun kişilerin kıblesi sabırdır, tahammüldür. Hiddete kapılıp hiç kimseyi çiğneme ki, seni de kimse çiğnemesin!", "likes": 9}];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
q.forEach((q,j)=>{
  let s=document.createElement('div');s.className='slide';
  let p=document.createElement('div');p.className='quote';p.textContent=q.text;
  s.appendChild(p);track.appendChild(s);
  let d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
function go(n){
  i=Math.max(0,Math.min(n,q.length-1));
  track.style.transform='translateX(-'+(i*100)+'%)';
  dots.querySelectorAll('.dot').forEach((d,j)=>d.className='dot'+(j===i?' active':''));
  count.textContent=(i+1)+'/'+q.length;
}
go(0);
let sx=0,ex=0,swiping=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiping=true});
document.addEventListener('touchmove',e=>{if(!swiping)return;ex=e.touches[0].clientX});
document.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;let d=sx-ex;if(Math.abs(d)>50)go(d>0?i+1:i-1)});
function toggleTP(){
    let v=document.getElementById('tp-view');
    let s=document.getElementById('swiper');
    let t=document.getElementById('tp-text');
    let b=document.getElementById('tp');
    if(v.classList.contains('active')){
        v.classList.remove('active');s.style.display='';b.textContent='\u25B6'
    }else{
        t.textContent=q[i].text;v.classList.add('active');s.style.display='none';b.textContent='\u23F9'
    }
}
</script>
</body></html>
