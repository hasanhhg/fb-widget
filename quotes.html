<!DOCTYPE html>
<html><head><title>Kadir Basan — Quotes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;font-family:-apple-system,'Helvetica Neue',sans-serif}
.swiper{width:100%;height:100%;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 32px}
.quote{color:#f0f0f5;font-size:22px;line-height:1.6;font-weight:400;text-align:center;max-width:600px;overflow:auto;max-height:100%}
.dots{position:fixed;bottom:60px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#f0f0f5;width:24px;border-radius:4px}
.count{position:fixed;top:50px;right:24px;color:rgba(255,255,255,.25);font-size:14px;font-weight:500;z-index:10}
.btn{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#f0f0f5;font-size:20px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.teleprompter{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#0f0f1a;display:none;overflow:hidden;padding:40px 20%}
.teleprompter.active{display:flex;align-items:center}
.t-text{color:#f0f0f5;font-size:26px;line-height:1.7;font-weight:400;text-align:center;animation:scroll 30s linear infinite}
.back{position:fixed;top:20px;left:20px;z-index:30;background:rgba(255,255,255,.1);border:none;color:#f0f0f5;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
</style></head>
<body>
<div class="swiper" id="swiper">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
</div>
<button class="btn" id="tp" onclick="toggleTP()">\u25B6</button>
<div class="teleprompter" id="tp-view">
  <button class="back" onclick="toggleTP()">✕ Done</button>
  <div class="t-text" id="tp-text"></div>
</div>
<script>
const q=[{"text": "Bütün mesele kendimizi Allah'a sevdirmekte. Zira Allah sevdiğini aleme Sevdirir fani dünyada", "likes": 4}, {"text": "Kaderi ancak dua değiştirir. Eğer o duayı etmek kaderinizde var ise..", "likes": 4}, {"text": "Sakın ben hakkımı ahirette senden alırım demeyin..! Dünyada iken tatlılıkla helalleşmeye çalışın. Nice alacaklı orada borçlu çıkacaktır", "likes": 6}, {"text": "Kalbinde cennet taşıyan insanlar var; Bulundukları her yere huzur veren, Hassas, kırılgan, içten, samimi, yüreği güzel insanlar... Allah bizi o özel insanlarla karşılaştırsın..", "likes": 6}, {"text": "BİSMİLLAHİRRAHMANİRRAHİM Öyle bir anahtar ki Açılmayan kapılar açılır Allah'ın izniyle 450 defa Hasbunallahu ve ni'mel vekil ni'mel Mevla ve nimennasir gufrâneke Rabbenâ ve ileyke'l-masir", "likes": 7}, {"text": "TIP DÜNYASINI ŞAŞIRTAN BESİN! KIZILCIK MEYVESİ ÜZERİNDE DENEYLER YAPILDI. Kızılcık meyvesi kanserli hücreleri 4 saat içerisinde yok etti Kızılcık, ekşi tadı ve yüksek besin değeriyle bilinen faydalı bir meyvedir. İçeriği C Vitamini: Bağışıklık sistemini destekler. Antioksidanlar: Hücreleri korur ve yeniler. Mineraller: Potasyum, kalsiyum, magnezyum ve lif içerir. Faydaları Bağışıklığı güçlendirir, hastalıklara karşı korur. İdrar yolu enfeksiyonlarını önlemeye yardımcı olur. Mide ve bağırsak sağlığını destekler. Kalp ve damar sağlığını korur, vücuttaki iltihabı azaltır. Nasıl Tüketilir? Taze veya Kuru: Doğrudan meyve olarak veya kurutularak yenebilir. Şerbet ve Komposto: Kaynatılarak suyu içilebilir. Marmelat ve Reçel: Kahvaltılarda tatlı-ekşi lezzet olarak kullanılabilir. Kızılcık Ekşisi: Salatalara sos olarak eklenebilir.", "likes": 8}, {"text": "Nazar değdiğini hissediyorsan, bu ayetleri unutma… Kalem Suresi’nin son iki ayeti, nazar konusunda sıkça okunan ayetlerdendir. İçinizden “Bana nazar değmiş olabilir” dediğiniz bir dönemden geçiyorsanız, bu ayetleri okuyup Allah’tan korunma dileyebilirsiniz. Kalem Suresi 51-52. ayetler: ﴿وَإِن يَكَادُ الَّذِينَ كَفَرُوا لَيُزْلِقُونَكَ بِأَبْصَارِهِمْ لَمَّا سَمِعُوا الذِّكْرَ وَيَقُولُونَ إِنَّهُ لَمَجْنُونٌ ۝ وَمَا هُوَ إِلَّا ذِكْرٌ لِّلْعَالَمِينَ﴾ Okunuşu: Ve in yekâdullezîne keferû le yuzlikûneke bi ebsârihim lemmâ semiûz-zikra ve yekûlûne innehû le mecnûn. Ve mâ huve illâ zikrun lil-âlemîn. Anlamı: “İnkâr edenler, Kur’an’ı işittikleri zaman neredeyse seni gözleriyle devirecekler ve ‘O, gerçekten delidir’ diyecekler. Oysa Kur’an, âlemler için ancak bir öğüttür.” Allah’ım; bizi nazardan, hasetten, kötü niyetten ve görünür görünmez her türlü kötülükten muhafaza eyle. Kalplerimize huzur, evlerimize bereket ver", "likes": 8}, {"text": "EVLİYALARIN DİLEK DUASI ( Dikkat Çok Kuvvetli Duadır Okurken Dikkatli Olun )(Bismillâhirrahmânirrahîm* Ve lâ havle ve lâ kuvvete illâ billâhil aliyyil azîm* Allahümme innî es'elüke yâ kadîmü* yâ dâimü* yâ ferdü* yâ vitru* yâ ehadü* yâ samedü* yâ hayyü* yâ kayyûmü* yâ zel celâli vel ikram* fein tevellev fekul hasbiyallahü lâ ilahe illâ hüve aleyhi tevekkeltü ve hüve rabbül arşil azîm.*)İsa (A.S.) bu mübarek duayı okur, ölüleri diriltirdi.Haceti veya bir dileği olan sabah namazını kıldıktan sonra kıbleye karşı oturur da bu duayı yüz defa okursa dileği gerçekleşir.Cenabı Hakkın velî kullarından olan Süleyman bin Mukatil hazretleri şöyle buyurmaktadır:Kim yukarıdaki duayı sabah namazından sonra yüz kez okuyup Cenabı Haktan dilekte bulunur da Allah onundileğini verir", "likes": 10}, {"text": "FATİHA SURESİ'NİN FAZİLETİ (ÇOK GÜÇLÜ BİR HACET DUASI) Hazreti Ali k.r.v. şöyle buyurmuştur: Fatiha suresini aşağıdaki tertip üzere günde bir (1) defa okuyan kimsenin dünyevi ve uhrevi muradı hasıl olur. Allah Teala insanların kalbini okuyan kimseye musahhar eder ve üzerinden bütün belaları kaldırır. Okumanın şekli şöyledir: Kimselerin olmadığı bir yerde beden ve elbisen temiz olarak güzelce bir abdest aldıktan sonra, iki rekat hacet namazı kıl. Namazdan sonra 70 defa istiğfar, 70 defada peygamberimiz hazreti Muhammed s.a.v. e salavat getir. Daha sonra aşağıdaki Fatiha nın tertibini 70 defa okuyup, hacetin her ne ise Allah Teala dan iste. Şüphesizki Allah c.c. okuyanın hacetini o gün belkide o saat içerisinde yerine getirir. Okuyan kimseye birçok kalb ve esrar kapıları açılır. Allah Teala hazretleri lütfi keremiyle okuyanı zengin eder. Şerif Buhari r.a. hazretleri der ki; Fatiha suresini bu tertip üzere hergün 7 defa okuyan kimse dünya ihtiyaçlarından hiç kimseye muhtaç olmaz ve Allah Teala okuyana ğayb kapılarını açar. Bismillâhirrahmânirrahîm. Elhamdülillâhi rabbil âlemîn. Yâ Hayyü Yâ Kayyûmu ecib Yâ Rûkyâîl. Semîan mutîan ente ve huddâmeke Müzhib. Bi hakki Elhamdülillâhi rabbil âlemîn. Ve bi hakkil Hayyil Kayyûmi ve bi hakki seyyidinâ Muhammedin aleyhissalâtü vesselâm ve bi hürmetil melâiketil müvekkelîne bi kavâimil arşi Ebced. Errahmânirrahîm. Yâ Raûfu Yâ Atûfu ecib Yâ Cebrâîl aleyhisselâm. Semîan mutîan ente ve huddâmeke Ebyad. Bi hakkir Rahmânirrahîmi Ve bi hakkir Raûfil Atûfi ve bi hakki seyyidinâ Muhammedin aleyhissalâtü vesselâm ve bi hürmetil melâiketil müvekkelîne bi kavâimil arşi Hevzah. Mâliki yevmiddîn. Yâ mukallibel kulûbi vel ebsâri ecib Yâ Semsemâîl semîan mutîan ente ve huddâmeke Ahmer. Bi hakki Mâliki yevmiddîn. Ve bi hakki mukallibel kulûbi vel ebsâri ve bi hakki seyyidinâ Muhammedin aleyhissalâtü vesselâm ve bi hürmetil melâiketil müvekkelîne bi kavâimil arşi Taykel. İyyâ kena'büdü ve iyyâ kenesteîn. Yâ Serîu Yâ Karîbü ecib Yâ Mîkâîl semîan mutîan ente ve huddâmeke Bürkân. Bi hakki İyyâ kena'büdü ve iyyâ kenesteîn. Ve bi hakkis Serîil Karîbi ve bi hakki seyyidinâ Muhammedin aleyhissalâtü vesselâm ve bi hürmetil melâiketil müvekkelîne bi kavâimil arşi Mensa'. İhdinas sirâtal müstakîm. Yâ Kadiru Yâ Muktediru Ecib Yâ Sarfeyâîl semîan mutîan ente ve huddâmeke Şemhûreş bi hakki İhdinas sirâtal müstakîm. Ve bi hakkil Kadiril Muktediri ve bi hakki seyyidinâ Muhammedin aleyhissalâtü vesselâm ve bi hürmetil melâiketil müvekkelîne bi kavâimil arşi Faskar. Sirâtallezîne enamte aleyhim. Yâ Alîmü Yâ Hakîmü. Ecib Yâ Anyâîl semîan mutîan ente ve huddâmeke Zevbeah. Bi hakki Sirâtallezîne enamte aleyhim. Ve bi hakki Alîmil Hakîmi ve bi hakki seyyidinâ Muhammedin aleyhissalâtü vesselâm ve bi hürmetil melâiketil müvekkelîne bi kavâimil arşi Şetsah. Ğayril mağdûbi aleyhim veladdâllîn. Yâ Kâhiru Yâ Azîzü ecib Yâ Kesfeyâîl. semîan mutîan ente ve huddâmeke Meymûn. Bi hakki Ğayril mağdûbi aleyhim veladdâllîn. Ve bi hakkil Kâhiril Azîzi ve bi hakki seyyidinâ Muhammedin aleyhissalâtü vesselâm ve bi hürmetil melâiketil müvekkelîne bi kavâimil arşi Zadzağ. Aksemtü aleyküm Yâ Melâiketir rûhâniyeti minel ulviyyâti ves süfliyyâti ve Yâ huddâme fâtihatil kitâbi ecîbûnî ve ümiddûnî ve a'yinûnî fî cemîı ümûrî elvâhan elvâhan elacele elacele essâate essâate bi hakkis sebıl mesânî vel kurânil azîm. Ve bi hakkil esrâri vel berekâti fîhâ bi hakki mâ ta'tekıdûnehü minel azameti vel bürhâni ve bi hürmeti seyyidinâ Muhammedin aleyhissalâtü vesselâm. Allâhümme sehhirlî abdikel refrefil Uhaydar inneke alâ külli şeyin kadîr. Bi rahmetike yâ erhamer râhimîn", "likes": 12}, {"text": "Günde 10 Defa Okuyun | La Havle Ve La Kuvvete İlla Billah Sabah 10 defa, akşam 10 defa ve yatarken 10 defa… “Lâ havle ve lâ kuvvete illâ billâh.” Allah’ın tevfik ve yardımını dilemek, günahlardan korunmak ve taate kuvvet bulmak için zikredilecek kıymetli bir tesbih. Rabbimiz bizleri her türlü beladan ve şeytanın tuzaklarından muhafaza eylesin. Amin.", "likes": 10}];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
q.forEach((q,j)=>{
  let s=document.createElement('div');s.className='slide';
  let p=document.createElement('div');p.className='quote';p.textContent=q.text;
  s.appendChild(p);track.appendChild(s);
  let d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
function go(n){
  i=Math.max(0,Math.min(n,q.length-1));
  track.style.transform='translateX(-'+(i*100)+'%)';
  dots.querySelectorAll('.dot').forEach((d,j)=>d.className='dot'+(j===i?' active':''));
  count.textContent=(i+1)+'/'+q.length;
}
go(0);
let sx=0,ex=0,swiping=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiping=true});
document.addEventListener('touchmove',e=>{if(!swiping)return;ex=e.touches[0].clientX});
document.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;let d=sx-ex;if(Math.abs(d)>50)go(d>0?i+1:i-1)});
function toggleTP(){
    let v=document.getElementById('tp-view');
    let s=document.getElementById('swiper');
    let t=document.getElementById('tp-text');
    let b=document.getElementById('tp');
    if(v.classList.contains('active')){
        v.classList.remove('active');s.style.display='';b.textContent='\u25B6'
    }else{
        t.textContent=q[i].text;v.classList.add('active');s.style.display='none';b.textContent='\u23F9'
    }
}
</script>
</body></html>
