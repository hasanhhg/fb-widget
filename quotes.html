<!DOCTYPE html>
<html><head><title>Kadir Basan — Quotes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;font-family:-apple-system,'Helvetica Neue',sans-serif}
.swiper{width:100%;height:100%;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 32px}
.quote{color:#f0f0f5;font-size:22px;line-height:1.6;font-weight:400;text-align:center;max-width:600px;overflow:auto;max-height:100%}
.dots{position:fixed;bottom:60px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#f0f0f5;width:24px;border-radius:4px}
.count{position:fixed;top:50px;right:24px;color:rgba(255,255,255,.25);font-size:14px;font-weight:500;z-index:10}
.btn{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#f0f0f5;font-size:20px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.teleprompter{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#0f0f1a;display:none;overflow:hidden;padding:40px 20%}
.teleprompter.active{display:flex;align-items:center}
.t-text{color:#f0f0f5;font-size:26px;line-height:1.7;font-weight:400;text-align:center;animation:scroll 30s linear infinite}
.back{position:fixed;top:20px;left:20px;z-index:30;background:rgba(255,255,255,.1);border:none;color:#f0f0f5;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
</style></head>
<body>
<div class="swiper" id="swiper">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
</div>
<button class="btn" id="tp" onclick="toggleTP()">\u25B6</button>
<div class="teleprompter" id="tp-view">
  <button class="back" onclick="toggleTP()">✕ Done</button>
  <div class="t-text" id="tp-text"></div>
</div>
<script>
const q=[{"text": "Düşersin de tutmazlar o canım dediklerin, gözünden sakındığın ömrünü verdiklerin... Menfaati bitenler tek tek çekip giderler, anlarsın kul kapısı yalan, Hakk’tır baki olan.” Kul kapısı yalan, dünya menfaat üzerine kurulu... Gözünden sakındıkların bile seni bir anda yalnız bıraktığında, kalbinde hissettiğin o sarsılmaz inançtır seni ayakta tutan. En zor anımızda, o son nefesimizde de yanımızda kalacak olan yalnızca Yaradan’dır.", "likes": 2}, {"text": "En Üstün Kadın Allah katında en üstün kadın Hz. Meryem ve Fir'avn'ın karısıdır. Allahu Teala (c.c.) şöyle buyuruyor: \"Allah, inananlara da Fir'avn'ın zevcesini misal gösterdi. O şöyle demişti: \"Rabb'im! Bana katından cennette bir ev yap, beni Fir'avn'dan ve onun işinde çalışmaktan koru ve beni zalimler topluluğundan kurtar!\" (Tahrim: 11.) \"Irzını korumuş olan, İmran kızı Meryem'i de Allah misal gösterdi. Biz, ona ruhumuzdan üfledik ve Rabb'inin sözlerini ve kitablarını tasdik etti. O gönülden itaat edenlerdendi.\" (Tahrim: 12.) Hani melekler, \"Ey Meryem! Allah, seni seçti. Seni tertemiz yaptı ve seni dünya kadınlarına üstün kıldı.\" (Ali İmran Suresi 42.) \"Ey Meryem! Rabbine divan dur. Secde et ve (O'nun huzurunda) rüku edenlerle beraber rüku et\" demişlerdi. (Ali İmran Suresi 43.) Bunlardan sonra Allah katında en üstün kadın Hz. Hatice'dir. O Rasulullah'a (s.a.v.) herkesten evvel iman etti. Sonra fazilet sırasında Hz.maria ve Hz. Fatıma gelir. Ümmetin kadınları arasında en çok hadis bilen, ilmi en fazla olan kadın sahabe, maria (r.a.) validemizdir.", "likes": 12}, {"text": "Mide Rahatsızlıklarına Manevi Bir Destek: Vakıa Suresi 65. Ayetin Sırrı Sık sık mide ağrısı, şişkinlik, hazımsızlık veya genel bir mide rahatsızlığı mı yaşıyorsunuz? Günlük hayat kalitenizi düşüren bu durumlar için tıbbi tedavilerinizin yanında, ruhunuza ve bedeninize şifa olacak mübarek bir manevi reçeteyi hayatınıza dahil edebilirsiniz. Mide Şifası İçin Mübarek Havas Uygulaması İslam alimleri ve manevi şifa rehberleri, midedeki genel geçer rahatsızlıkların hafiflemesi ve şifaya kavuşması için Vakıa Suresi'nin bu özel ayetindeki sırra sığınmayı tavsiye etmişlerdir: Mübarek Ayet: Vakıa Suresi 65. Ayet-i Kerime Okunuşu: \"Lev neşâu lecelnâhu hutâmen fe zaltum tefekkehûn.\" Anlamı: \"Dileseydik onu kuru bir kırıntı yapardık, siz de şaşırıp kalırdınız.\" Zikir Adedi: Şifa niyetiyle, halis bir kalp ve teslimiyetle bu ayet-i kerime tam 46 defa zikredilir. Biiznillah, midesinde kronik veya başka büyük bir yapısal rahatsızlığı olmayan kimselerin, bu tertibe ihlasla devam ettiklerinde midedeki genel geçer ağrı ve rahatsızlıklara çok iyi geldiği aktarılmıştır. Önemli Sağlık Notu Dualarımız ve zikirlerimiz, şifa yolculuğumuzun en güçlü manevi kalkanıdır. Ancak unutmamalıyız ki İslam dini önce tedbiri, sonra tevekkülü emreder. Mide rahatsızlıkları; ciddi ülser, gastrit, reflü veya başka önemli sağlık sorunlarının habercisi olabilir. Bu yüzden öncelikle bir gastroloji uzmanına veya doktorunuza görünmeyi, size verilen tıbbi tedavileri ve diyetleri uygulamayı ihmal etmeyin. Bu mübarek zikri, tedavinize en güzel manevi destekçi olarak niyet ederek uygulayın.", "likes": 10}, {"text": "YILLARDIR DİLDEN DİLE AKTARILAN ŞİFA SIRRINI DUYDUNUZ MU? Doku yırtıkları, kas zedelenmeleri ve bağ kopması sorunları yaşayanlar için manevi bir reçete... Vücudumuzda meydana gelen bağ ve doku hasarları, günlük yaşamı zorlaştıran ve ciddi sabır gerektiren rahatsızlıklardır. Elbette ilk adımımız her zaman tıbbi tedavi ve hekimlerimizin tavsiyelerine uymaktır. Ancak tıbbi tedavilerimizin yanı sıra duaların, ayetlerin ve manevi reçetelerin gücüne sığınmak ruhumuza ve bedenimize şifa kapılarını aralar. Rabbimizin kelamı olan Kur'an-ı Kerim'in her bir ayeti müminler için şifadır. Yıllardır dilden dile aktarılan ve tecrübe edilen şeriflerden biri de Vakıa Suresi'nin 62. ayet-i kerimesidir. Şifa Niyetiyle Nasıl Uygulanır? Temiz bir abdest alınır. Şifa aranılan, ağrılı veya hasarlı bölgeye sağ el konularak niyet edilir. Vakıa Suresi 62. Ayeti tam 176 defa ihlasla okunur. Eksik veya fazla olmamasına özen gösterilerek \"Biiznillah\" şifa niyaz edilir. Vakıa Suresi 62. Ayet Okunuşu: \"Ve lekad alimtumun neş’etel ûlâ fe lev lâ tezekkerûn.\" Meali: \"Andolsun, ilk yaratılışı bildiniz. O hâlde düşünsenize!\"", "likes": 12}, {"text": "SADECE 30 SANİYE AYIRIN… BU AYETİN NEDEN DİLDEN DİLE AKTARILDIĞINI ANLAYACAKSINIZ. Gözlerimiz, dünyayı seyrettiğimiz en kıymetli nimetlerimizden biri. Gün boyu ekranlara bakmaktan kaynaklanan göz yorgunluğu, görme zayıflığı veya göz rahatsızlıkları yaşayanlar için kadim bir şifa reçetesi... Elbette göz sağlığımız için doktor kontrolleri ve tıbbi tedavi ilk önceliğimizdir. Ancak tıbbi bakımın yanında Kur'an-ı Kerim’in şifa dolu ayetlerine sığınmak, gözlerimize nur ve fer bağışlaması için duaların gücünden faydalanmak çok kıymetli bir manevi destektir. İslam alimlerinin ve tecrübe edenlerin aktardığı manevi reçeteye göre; Necm Suresi'nin 15. ayet-i kerimesini 45 defa okumanın gözleri keskinleştirdiğine, göz rahatsızlıklarına şifa olduğuna ve göz nurunu artırdığına vesile olduğu belirtilmektedir. Şifa Niyetiyle Nasıl Uygulanır? Temiz bir abdest alınır. Sağ elinizin işaret parmağını veya avuç içinizi hafifçe gözlerinizin üzerine koyun ya da parmak uçlarınıza üflemek üzere hazırlanın. Necm Suresi 15. Ayeti tam 45 defa ihlas ve samimiyetle okunur. Okuma bittikten sonra parmak uçlarına üflenerek gözlere sürülür ve \"Biiznillah\" şifa niyaz edilir. Necm Suresi 15. Ayet Okunuşu: \"İndehâ cennetul me'vâ.\" Meali: \"Ki onun yanında Me'vâ cenneti vardır.\" Göz zayıflığı yaşayan, gün boyu telefona/bilgisayara bakan ve şifaya ihtiyacı olan sevdiklerinize bu videoyu göndererek hayra vesile olun. İhtiyaç anında tekrar açıp okuyabilmek için gönderiyi mutlaka kaydedin.", "likes": 11}, {"text": "Vücuttaki güçsüz bölgelerin, kemik ağrısının ve kırıkların şifası için Yasin Suresi'nin 78.79.80.81.82.83.ayeti kerimeleri temiz bir zeytinyağı üzerine 40 kere okunduktan sonra bu zeytinyağı zikredilen rahatsızlıkların olduğu bölgelere sürülürse Allahu Teala o kişiye biiznillah şifa ihsan eder. Kaynak: Cübbeli Ahmet Hocaefendi/Yasin-i Şerif Cüzü 117-118 BORÇLARIN ÖDENMESİ İÇİN YASİN SURESİ OKUMAK* Ağır borç yükleri altında ezilen bir kişi o borçtan kurtulmak niyetiyle Gece sabaha karşı (imsaktan önce) kalkıp abdest alarak kıbleye karşı oturup 3 defa Yasin Suresini okur ve bu şekilde 7 gece devam ederse Allah-u Teala onu borçlarından kurtarır", "likes": 11}, {"text": "Kendini tüketme.. Çünkü seni ayakta tutan, İnsanlar değil; Allah’ın rahmetidi", "likes": 30}, {"text": "Şefaat Salavatı, Peygamber Efendimiz Hz. Muhammed’in (s.a.v.) ahiretteki yüce makamını, mülkünü, ruhunu ve mübarek bedenini tek bir duada toplayarak O'nun en yüksek şefaatine nail olmayı amaçlayan çok kapsamlı bir zikirdir. Efendimizin ruhuna, cesedine ve kabrine ayrı ayrı selam gönderdiği için okuyan kişi ile Allah Resulü arasında çok güçlü bir manevi bağ ve muhabbet köprüsü kurulur... Şefaat salavatının Okunuşu \"Allahümme salli ve sellim ve barik ala seyyidina ve nebiyyina Muhammedin fil-evveline ve fil-ahirin. Ve fi kulli vaktin ve hinin. Allahümme salli ve sellim ve barik ala seyyidina Muhammedin minel-kevneyni vessel-vassiyeti. Allahümme salli ve sellim ve barik ala ruhi seyyidina Muhammedin fil-ervah. Ve ala cesedihi fil-ecsad. Ve ala kabrihi fil-kubur. Allahümme salli ve sellim ve barik ala seyyidina ve mevlana Muhammedin fil-hidayeti vel-irsad. Allahümme salli ve sellim ve barik ala seyyidina Muhammedin sahibil-vesileti vel-fazileti ved-derecetir-refia. Allahümme salli ve sarik ala seyyidina Muhammedinil-meb'usi rahmeten lil'alemin. Allahümme salli ve sellim ala seyyidina Muhammedin sahibil-burak vel-mirac. Allahümme salli ve sellim ve barik ala seyyidina Muhammedin ve ala alihi ve ashabihi ecmain.\" Şefaat Salavatının Manası \"Allah'ım! Efendimiz ve Peygamberimiz Muhammed'e geçmişte ve gelecekte... her an ve zamanda salat, selam ve bereket eyle. Allah'ım! İki alemin ve vasiyetin sahibi Efendimiz Muhammed'e salat, selam ve bereket eyle. Allah'ım! Ruhlar arasında Efendimiz Muhammed'in ruhuna... bedenler arasında O'nun bedenine... kabirler arasında O'nun kabrine salat, selam ve bereket eyle. Allah'ım! Hidayet ve irşad yolunda Efendimiz ve Mevlamız Muhammed'e salat, selam ve bereket eyle. Allah'ım! Vesile, fazilet ve en yüksek derecelerin sahibi olan Efendimiz Muhammed'e salat, selam ve bereket eyle. Allah'ım! Alemlere rahmet olarak gönderilen Efendimiz Muhammed'e salat ve bereket eyle. Allah'ım! Burak ve Miraç sahibi Efendimiz Muhammed'e salat ve selam eyle. Allah'ım! Efendimiz Muhammed'e, O'nun bütün ailesine (âline) ve ashabına bütünüyle salat, selam ve bereket ihsan eyle", "likes": 14}, {"text": "Gönülden edilen her dua, Rabbimize açılan bir kapıdır. Allah hepimizin kapısını hayırla, güzellikle ve huzurla açsın. Âmin.", "likes": 16}, {"text": "Allah'ın izniyle dertlerinize derman olmaya niyet ediyoruz, kıymetli kardeşlerim. ya latif ya fettah isminle Hayat bazen ağır gelir, yollar taşlı, kalpler kırık olur. Ancak her sıkıntının ardından bir hikmet, her duanın ardında bir umut vardır. Rabbimizin izniyle manevi destek ve dua talebinde bulunun Allahtan kardeşlerim elimizden geldiğince yardımcı olmaya çalışın Rabbim gönlünüzdeki hayırlı dilekleri kabul eylesin, kalbinize huzur ve bereket versin. Allah herkesin hakkında hayırlısını nasip etsin amenna saddakna", "likes": 18}];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
q.forEach((q,j)=>{
  let s=document.createElement('div');s.className='slide';
  let p=document.createElement('div');p.className='quote';p.textContent=q.text;
  s.appendChild(p);track.appendChild(s);
  let d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
function go(n){
  i=Math.max(0,Math.min(n,q.length-1));
  track.style.transform='translateX(-'+(i*100)+'%)';
  dots.querySelectorAll('.dot').forEach((d,j)=>d.className='dot'+(j===i?' active':''));
  count.textContent=(i+1)+'/'+q.length;
}
go(0);
let sx=0,ex=0,swiping=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiping=true});
document.addEventListener('touchmove',e=>{if(!swiping)return;ex=e.touches[0].clientX});
document.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;let d=sx-ex;if(Math.abs(d)>50)go(d>0?i+1:i-1)});
function toggleTP(){
    let v=document.getElementById('tp-view');
    let s=document.getElementById('swiper');
    let t=document.getElementById('tp-text');
    let b=document.getElementById('tp');
    if(v.classList.contains('active')){
        v.classList.remove('active');s.style.display='';b.textContent='\u25B6'
    }else{
        t.textContent=q[i].text;v.classList.add('active');s.style.display='none';b.textContent='\u23F9'
    }
}
</script>
</body></html>
