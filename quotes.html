<!DOCTYPE html>
<html><head><title>Kadir Basan — Quotes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;font-family:-apple-system,'Helvetica Neue',sans-serif}
.swiper{width:100%;height:100%;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 32px}
.quote{color:#f0f0f5;font-size:22px;line-height:1.6;font-weight:400;text-align:center;max-width:600px;overflow:auto;max-height:100%}
.dots{position:fixed;bottom:60px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#f0f0f5;width:24px;border-radius:4px}
.count{position:fixed;top:50px;right:24px;color:rgba(255,255,255,.25);font-size:14px;font-weight:500;z-index:10}
.btn{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#f0f0f5;font-size:20px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.teleprompter{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#0f0f1a;display:none;overflow:hidden;padding:40px 20%}
.teleprompter.active{display:flex;align-items:center}
.t-text{color:#f0f0f5;font-size:26px;line-height:1.7;font-weight:400;text-align:center;animation:scroll 30s linear infinite}
.back{position:fixed;top:20px;left:20px;z-index:30;background:rgba(255,255,255,.1);border:none;color:#f0f0f5;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
</style></head>
<body>
<div class="swiper" id="swiper">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
</div>
<button class="btn" id="tp" onclick="toggleTP()">\u25B6</button>
<div class="teleprompter" id="tp-view">
  <button class="back" onclick="toggleTP()">✕ Done</button>
  <div class="t-text" id="tp-text"></div>
</div>
<script>
const q=[{"text": "Bir daha bu yaşta olmayacaksın seni yoran her şeyden Uzaklaş", "likes": 6}, {"text": "Sırrımdaki beşeriyet perdesini yak, beni öyle saf bir nur kıl ki içine hiçbir karanlık sızamasın… ve havas dünyasının en derin, en yüksek frekanslı metinlerinden biri: Hizbü’l-Müfred (Saf Titreşim) Sırrı. Gelenekte Gavs-ı Âzam Abdülkadir Geylânî Hazretleri’ne atfedilen bu özel vird; kulun dünyevi tüm aracıları, engelleri ve maskeleri arkada bırakıp Doğrudan Zat-ı İlahi’ye sığındığı manevi bir imdat çığlığıdır. METNİN DERİN SIRLARI VE SEMBOLİZMİ 1. \"Âh\" (آهٍ) Frekansı: Havas ilminde Elif (Hakikat) ve He (Huviyet) harflerinin birleşimidir. Sıradan bir acı çığlığı değil; kulun benliğini sıfırlayarak Allah’ın Hû ve Hayy isimlerini kalbin en derin noktasından dışarı vurmasıdır (Nefes-i Rahmanî). 2. Harf Şifreleri (İlm-i Hurûf): Metindeki Lâm-ıl-Lâhut (İlahi alemin kapısı) ve Hâ-il-Huvviyet (Mutlak görünmezliğin sembolü) ifadeleriyle kul, Allah'ı sadece sıfatlarıyla değil, doğrudan \"Zat'ı\" ile talep eder. 3. Beşeriyet Perdesinin Yanması: \"Sırrımdaki engelleri yak, beni saf bir nur kıl!\" talebi; kişinin dünyevi illüzyonlardan sıyrılıp olaylara ilahi bir basiretle bakma arzusudur. OKUNACAK DUA METNİ \"Bismillâhirrahmânirrahîm. Yâ Ahade men lâ ahade leh, yâ Sende men lâ sende leh. Allâhümme innî es’elüke bi-Lâm-il-lâhut, ve bi-Hâ-il-huvviyet-il-uzmâ. (Âhın, Âhın, Âhın!) Bi-nûri vechikallézî edâet minhü şümûsü’l-gayb. İlahî, tahrık hıgâbel-beşeriyyeti fî sirrî, ve’c-alnî nûran sâfiyen lâ yüdhılühû zulmetün ve lâ yu’cizühû şey’ün fî’l-ardı ve lâ fî’s-semâ. Yâ Kâfiyen min külli şey, ikfinî mâ ehemmenî bi-sırri (Âhın Yâ Hû).\" Derin Anlamı: \"Ey kimsesi olmayanın yegâne teki, ey dayanağı olmayanın tek dayanağı olan Allah'ım! İlahi saltanatın Lâm'ı ve o en büyük Huviyetin Hâ'sı hürmetine Senden istiyorum. (Âhın! Âhın! Âhın!) Gaybın güneşlerinin aydınlandığı o Zatının nuru hürmetine... İlahî! Sırrımdaki beşeriyet perdesini yak, beni öyle saf bir nur kıl ki içine hiçbir karanlık sızamasın. Ey her şeye tek başına yeten! Beni kaygılandıran, önümü tıkayan ne varsa (Âhın Yâ Hû) sırrıyla bana yet, beni kurtar.\" MANEVİ ADABI VE OKUNUŞU Vakit: Gece veya seher vaktinde, tam bir tenhada ve sessizlikte. Niyet: Dünyevi kaygıları dışarıda bırakarak, abdestli bir şekilde kıbleye dönerek 3 defa okunur. Uygulama: (Âhın) kısımlarında derin bir nefes boşaltılarak manası kalpten hissedilir. Dengeleme: Okuma bittikten sonra manevi ısıyı ve Celal tecellisini yumuşatmak için 100 defa \"Yâ Latîf\" çekilmesi tavsiye edilir. Kaydetmeyi, sevdiklerinizle paylaşmayı ve kalbinizden geçen niyetleri yorumlara bırakmayı unutmayın.", "likes": 7}, {"text": "Büyük mutasavvıf İbnü'l-Arabî, varlığı \"İlahi isimlerin tecellisi\" olarak tanımlar. O’nun öğretisinde zikir, sadece mekanik bir sayı tekrarı değil, kalbin o ismin hakikatiyle buluşmasıdır. Peki, isimlerin birbirini tamamlayan manalarını bir araya getirerek tefekkür etmeye ne dersiniz \"Esma Eşleşmeleri\" ile Kalbi Tefekkür İbnü'l-Arabî’ye göre her isim, kainatta belirli bir ilahi hakikati yansıtır. İki ismin manasını kalpte birleştirmek, o isimlerin temsil ettiği hakikatlerin birbiriyle olan bağını hissetmektir. İşte bazı manevi yönelimler için esma eşleşmeleri: Zorlukların Aşılması ve Hakikat: “Yâ Fettâh, Yâ Adl” (Açıcı ve Adaletli olan; tüm kapıların adaletle ve hayırla açılması için.) Şifa ve Rahmet: “Yâ Şâfî, Yâ Rahmân” (Şifa veren ve sonsuz merhamet sahibi olan; bedeni ve ruhu rahmetinle şifalandırman için.) Bereket ve Genişleme: “Yâ Bâsit, Yâ Rezzâk” (Genişleten ve rızkı veren; daralan rızkın ve gönlün genişlemesi için.) Huzur ve Arınma: “Yâ Kuddûs, Yâ Selâm” (Tertemiz olan ve selamet veren; kalbi dünyevi gürültülerden arındırıp sükunete kavuşmak için.) İzzet ve Lütuf: “Yâ Azîz, Yâ Kerîm” (Üstün ve İkram sahibi olan; izzeti, O'nun sonsuz lütfuyla buluşturmak için.) Nasıl Uygulanır Bu uygulamada temel esas \"huzur-u kalp\"tir. İsimleri Birleştirin: İki ismin manasını bir arada düşünerek, \"Yâ Fettâhu Yâ Adl\" şeklinde, birbirine bağlı bir bütün olarak zikredin. Sayıdan Ziyade Derinlik: Önemli olan belli bir sayıya ulaşmak değil, o isimlerin manasını zihninizde ve kalbinizde hissedebilmektir. İstikrar: Zikir, bir alışkanlık değil, bir yaşam biçimi ve O'na yönelme sanatıdır. Düzenli olarak (vird şeklinde) devam etmek, kalpteki perdelerin kalkmasına yardımcı olur. \"Göklerde ve yerde ne varsa O’ndan ister. O, her an yeni bir tecellidedir.\" (Rahmân, 29) Not: Bu eşleşmeler, isimlerin manaları üzerine kurulmuş birer tefekkür rehberidir. Bu zikir yönteminde en önemli kural mekanik bir tekrar değil, \"kalbi bir dil\" oluşturmaktır. İki ismi tek bir nefeste, manalarını kalbinizde hissederek ve birbirine bağlayarak zikretmelisiniz.", "likes": 6}, {"text": "\"Asla sahip olmadığın şeyler için iizülme! Kısmetinde varsa, Onlar seni bulur zamanı gelince'", "likes": 13}, {"text": "Bu Güzel Akşamında; Huzur Hiç Gitmeyen Misafiriniz Olsun.. Yaşamınızdan Güzellikler, Yüreğinizden Sevinçler Evinizden Bereket Hiç Eksik Olmasın.. Hayırlı, Huzurlu cuma A k ş a m l a rınız olsun", "likes": 13}, {"text": "Hayat bir Yolculuktur.. Mutlu olmadığınız Duraklarda.. Fazla Oyalanmayın... Yüreğimize YüreğiyLe Gelen İnsanlara,, Rast gelesiniz", "likes": 14}, {"text": "\"İmanın tadını alan kalp, dünya lezzetlerine doyamaz. Çünkü o kalp artık Rabbinin huzurunda sükûnu bulmuştur. Ne güzel tattır; ne zaman unutulsa, özlenir…", "likes": 11}, {"text": "SONBAHAR EKİNOKSUNA ÖZEL DENGE VE HUZUR ZİKRİ 23 Eylül, gündüz ile gece sürelerinin birbirine en çok yaklaştığı ve sonbaharın başladığı özel bir geçiş zamanıdır. Bu günü; Allah’ın yaratışındaki ölçüyü ve kusursuz düzeni tefekkür ederek, hayatımızdaki dengesizlikleri fark etmek ve yeni mevsime dua ile başlamak için değerlendirebiliriz. Kalbinizdeki sıkışıklığın hafiflemesi, hanenize huzur gelmesi, işlerinizin düzene girmesi ve hayatınızda hayırlı bir denge kurulması niyetiyle görseldeki zikri okuyabilirsiniz. Zikre 11 salavatla başlayın. Her Esmâyı anlamını düşünerek, acele etmeden ve samimiyetle okuyun. Ardından gönlünüzdeki hayırlı niyetleri Allah’a arz edin ve çalışmayı 11 salavatla tamamlayın. “Allah’ım, hayatımda dengesini kaybeden her şeyi lütfunla düzene koy. Kalbime huzur, haneme bereket, işlerime kolaylık ve ömrüme hayırlı güzellikler nasip eyle. Âmin.”", "likes": 18}, {"text": "Masha'Allah Vertaling verbergen ‎عبود رحيمه‎ · Originele audio ‎عبود رحيمه‎ · Originele audio ‎عبود رحيمه‎ · Originele audio عبود رحيمه · Volgen 3 Aug", "likes": 1}, {"text": "De atmosfeer van de bezoek van binnenuit in de heiligdom van Imam Hussein (vrede zij hem) #وفاء_للحسين #الامام_الحسين #شهر_صفر #زيارة_الاربعين #العتبة_الحسينية_المقدسة Vertaling verbergen ‎العتبة الحسينية المقدسة‎ · Originele audio ‎العتبة الحسينية المقدسة‎ · Originele audio ‎العتبة الحسينية المقدسة‎ · Originele audio العتبة الحسينية المقدسة · Volgen 4 Aug", "likes": 3}];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
q.forEach((q,j)=>{
  let s=document.createElement('div');s.className='slide';
  let p=document.createElement('div');p.className='quote';p.textContent=q.text;
  s.appendChild(p);track.appendChild(s);
  let d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
function go(n){
  i=Math.max(0,Math.min(n,q.length-1));
  track.style.transform='translateX(-'+(i*100)+'%)';
  dots.querySelectorAll('.dot').forEach((d,j)=>d.className='dot'+(j===i?' active':''));
  count.textContent=(i+1)+'/'+q.length;
}
go(0);
let sx=0,ex=0,swiping=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiping=true});
document.addEventListener('touchmove',e=>{if(!swiping)return;ex=e.touches[0].clientX});
document.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;let d=sx-ex;if(Math.abs(d)>50)go(d>0?i+1:i-1)});
function toggleTP(){
    let v=document.getElementById('tp-view');
    let s=document.getElementById('swiper');
    let t=document.getElementById('tp-text');
    let b=document.getElementById('tp');
    if(v.classList.contains('active')){
        v.classList.remove('active');s.style.display='';b.textContent='\u25B6'
    }else{
        t.textContent=q[i].text;v.classList.add('active');s.style.display='none';b.textContent='\u23F9'
    }
}
</script>
</body></html>
