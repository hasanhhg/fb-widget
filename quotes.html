<!DOCTYPE html>
<html><head><title>Kadir Basan — Quotes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;font-family:-apple-system,'Helvetica Neue',sans-serif}
.swiper{width:100%;height:100%;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 32px}
.quote{color:#f0f0f5;font-size:22px;line-height:1.6;font-weight:400;text-align:center;max-width:600px;overflow:auto;max-height:100%}
.dots{position:fixed;bottom:60px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#f0f0f5;width:24px;border-radius:4px}
.count{position:fixed;top:50px;right:24px;color:rgba(255,255,255,.25);font-size:14px;font-weight:500;z-index:10}
.btn{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#f0f0f5;font-size:20px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.teleprompter{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#0f0f1a;display:none;overflow:hidden;padding:40px 20%}
.teleprompter.active{display:flex;align-items:center}
.t-text{color:#f0f0f5;font-size:26px;line-height:1.7;font-weight:400;text-align:center;animation:scroll 30s linear infinite}
.back{position:fixed;top:20px;left:20px;z-index:30;background:rgba(255,255,255,.1);border:none;color:#f0f0f5;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
</style></head>
<body>
<div class="swiper" id="swiper">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
</div>
<button class="btn" id="tp" onclick="toggleTP()">\u25B6</button>
<div class="teleprompter" id="tp-view">
  <button class="back" onclick="toggleTP()">✕ Done</button>
  <div class="t-text" id="tp-text"></div>
</div>
<script>
const q=[{"text": "Senukri-uke felâ tensâ.Ve nuyessiruke lilyusrâ.", "likes": 3}, {"text": "ZAMANIN GİZLİ KODLARI: İbnü’l-Arabî’ye Göre Saatler ve Tecelliler Zaman, sadece saatlerin mekanik tık-tıklarıyla akan bir süreç midir, yoksa her anı bir İsm-i İlâhî'nin tecellisiyle yenilenen canlı bir doku mu Şeyh-i Ekber İbnü’l-Arabî, el-Fütûhâtü’l-Mekkiyye ve Evrâdu’l-Eyyâm ve’l-Leyâl eserlerinde zamanın her bir diliminin (gündüzün 12, gecenin 12 saati) belirli bir ilâhî ismin tecelli mahalli olduğunu açıklar. Tasavvufta \"İbnü'l-vakit\" (vaktin oğlu) olmak; felekleri veya saatleri birer müstakil güç kaynağı görmek değil, o an tecelli eden İlâhî İsim karşısında kulluk ve marifet bilincinde olmaktır. Çünkü \"Lâ tekrâre fi't-tecellî\" (Tecellide tekrar yoktur); varlık her an yeni bir şe'ndedir. HAFTANIN GÜNLERİ VE HÂKİM İSİMLER (İslam astronomisinde günün ilk saati Güneş doğarken başlar.) Pazar (Güneş / Şems): el-Hayy Hayat, varlık enerjisi, kalbî marifet ve basiret talebi. Pazartesi (Ay / Kamer): el-Kâdir İlâhî ölçü, takdir, kalbî safiyet ve nefsin sükûnu. Salı (Mars / Merîh): el-Murîd İlâhî irade, sebat, nefsin vesveselerine karşı manevi duruş. Çarşamba (Merkür / Utârid): el-Âlim İlim, hikmet, kavramsal idrak ve zihni açılım. Perşembe (Jüpiter / Müşterî): el-Mütekellim İlâhî hitap, manevi lütuf, şükür ve kalbî genişlik. Cuma (Venüs / Zühre): es-Semî' Duaların icabeti, ilâhî muhabbet, zarafet ve şefkat. Cumartesi (Satürn / Zühal): el-Basîr Derin müşahede, sabır, nefsi terbiye ve öz'e dönüş. İbnü'l-Arabî’den Bir Saat Münacatı: \"İlâhî! Sen her görünenin görünmezini kuşatan Şâhid'sin. Varlığım, Senin tecellini müşahede etmeme perde olmasın; beni her an Seninle olanlardan eyle.\"", "likes": 2}, {"text": "Zorlukları Aşan, Kapalı Kapıları Açan O Sır... Yasin Suresi'nin 9. ayet-i kerimesi, manevi bir kalkan oluşturmak, hayırlı hacetlerin kabulü ve engellerin kalkması için çok güçlü bir vesiledir. Bir muradınız, aşamadığınız bir zorluk veya bir hacetiniz olduğunda temiz bir kalple ve ihlasla 21 defa okunması tavsiye edilir. Ayetin Meali: \"Biz onların önlerine bir set, arkalarına da bir set çektik. Böylece onları kuşattık; artık görmezler.\" (Yasin Suresi, 9) Yasin Suresi 9.Ayet: Ve cealna mim beyni eydihim seddev ve min halfihim sedden fe ağşeynahum fehum la yubsirûn.", "likes": 13}, {"text": "Şifa duası, kişilerin bedenlerinde hissettikleri ağrıları ve hastalıkları iyileştirmek amacıyla okudukları dualardır. Özellikle kulak ağrısı gibi rahatsızlıklara karşı tesirli olan bu dua, iç huzur ve şifa arayanlar tarafından tercih edilmektedir. Şifa duasının okunuşu şöyledir: Bismillah Bismillah Bismillah Eûzü bi-izzetillahi ve kudretihi min şerri mâ ecidu ve uhâziru. Bu duayı 7 kez tekrar ederek okuyabilir ve her tekrarın ardından \"Amin\" diyebilirsiniz. Anlamı: \"Allah'ın izzet ve kudretine sığınarak, bedenimde çekmekte olduğum hastalığın şerrinden korunuyorum.\"", "likes": 15}, {"text": "\"Allah’ım, kulak ve gözlerime kuvvet ver, onları bana varis kıl (bağlı kıl), bana haksızlık edene karşı yardım et ve intikamımı ondan al.\" \"Bismillahrrahmanirrahim. Allahumme mettiğnî bi sem ‘i ve basarî vec’alhümâ el vârise minnî vensurnî alâ men zalemenî ve huz minhu bi şe’rî.\"", "likes": 11}, {"text": "Kulak ağrısı için elinizi ağrıyan kulağın üzerine koyup 3 defa \"Bismillah\" diyerek 7 defa \"Eûzü bi-izzetillâhi ve kudratihî min şerri mâ ecidü ve ühâziru\" (Hissettiğim ve sakındığım bu hastalığın şerrinden Allah'ın izzetine ve kudretine sığınırım) duasını okuyabilirsiniz. Ayrıca Hz. Peygamber'in şifa için okuduğu \"Ezhibil-be'se rabben-nâsi, eşfi enteş-şâfi, lâ şifâe illâ şifâuke, şifâen lâ yuğâdiru sekamen\" duası da okunabilir", "likes": 10}, {"text": "HER İŞİMİZİN BAŞI BESMELE OLSUN İNŞALLAH,", "likes": 39}, {"text": "Allah, Talâk Suresi 3. ayetinde diyor ki… “Kim Allah’a güvenip dayanırsa, O ona yeter.” Bazen ne yapacağını bilemezsin… Ama unutma, Allah’a güvenen asla yalnız değildir. Kalbini Allah’a bırak, gerisini O’na bırak. Cümleten… hayırlı cumalar.", "likes": 15}, {"text": "Kalbin daraldığında, zihnin yorulduğunda ve içinden çıkamadığın anlarda bu duayı okuyabilirsin. Lâ ilâhe illallâhü’l-azîmü’l-halîm. Lâ ilâhe illallâhü Rabbü’l-Arşi’l-azîm. Lâ ilâhe illallâhü Rabbü’s-semâvâti ve Rabbü’l-ardı ve Rabbü’l-Arşi’l-kerîm. Rabbim gönlümüze ferahlık, işlerimize kolaylık nasip etsin. Âmin. Duayı kaydet, ihtiyaç duyduğunda yeniden okuyabilmek için yanında olsun.", "likes": 18}, {"text": "akıa Suresi 38. ayette geçen \"Li ashâbi-l yemîn\" (Sağdakiler, iyilik ve bereket ehli için) ifadesi, manevi gelenekte bedensel ve ruhsal dengenin, hücresel esenliğin simgesi kabul edilir. Geleneksel manevi reçetelerde; bağırsaklarda oluşan genel ve geçici ağrı, sızı ile sindirim hassasiyetlerinden arınmak niyetiyle bu ayetin 147 defa okunmasının sindirim sistemine ferahlık ve şifa getireceğine inanılır. Biyolojik Saat, Hormonlar ve Manevi Odak: Hormon Saatleri ve İkinci Beyin: Vücudumuzdaki kortizol, melatonin ve serotonin gibi hormonlar günün belirli saatlerinde yükselip alçalır. \"İkinci beynimiz\" olan bağırsaklar, hormonların gün ve saat içindeki bu değişimlerine doğrudan tepki verir. 147 Defa Tekrar ve Sinir Sistemi: Ritmik olarak 147 defa yapılan odaklanma ve zikir, Vagus siniri aracılığıyla otonom sinir sistemini sakinleştirir. Zihinsel stres azaldıkça bağırsak kaslarındaki gerginlik ve sızılar yatışır. Bütüncül Denge: Tıbbi teşhisleri, beslenme düzenini ve doktor tavsiyelerini aksatmadan; bedenimizin biyolojik ritmine uygun niyetler ve dualarla ruhsal bir destek oluşturmak arınma sürecini tamamlar.", "likes": 10}];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
q.forEach((q,j)=>{
  let s=document.createElement('div');s.className='slide';
  let p=document.createElement('div');p.className='quote';p.textContent=q.text;
  s.appendChild(p);track.appendChild(s);
  let d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
function go(n){
  i=Math.max(0,Math.min(n,q.length-1));
  track.style.transform='translateX(-'+(i*100)+'%)';
  dots.querySelectorAll('.dot').forEach((d,j)=>d.className='dot'+(j===i?' active':''));
  count.textContent=(i+1)+'/'+q.length;
}
go(0);
let sx=0,ex=0,swiping=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiping=true});
document.addEventListener('touchmove',e=>{if(!swiping)return;ex=e.touches[0].clientX});
document.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;let d=sx-ex;if(Math.abs(d)>50)go(d>0?i+1:i-1)});
function toggleTP(){
    let v=document.getElementById('tp-view');
    let s=document.getElementById('swiper');
    let t=document.getElementById('tp-text');
    let b=document.getElementById('tp');
    if(v.classList.contains('active')){
        v.classList.remove('active');s.style.display='';b.textContent='\u25B6'
    }else{
        t.textContent=q[i].text;v.classList.add('active');s.style.display='none';b.textContent='\u23F9'
    }
}
</script>
</body></html>
