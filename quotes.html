<!DOCTYPE html>
<html><head><title>Kadir Basan — Quotes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;font-family:-apple-system,'Helvetica Neue',sans-serif}
.swiper{width:100%;height:100%;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 32px}
.quote{color:#f0f0f5;font-size:22px;line-height:1.6;font-weight:400;text-align:center;max-width:600px;overflow:auto;max-height:100%}
.dots{position:fixed;bottom:60px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#f0f0f5;width:24px;border-radius:4px}
.count{position:fixed;top:50px;right:24px;color:rgba(255,255,255,.25);font-size:14px;font-weight:500;z-index:10}
.btn{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#f0f0f5;font-size:20px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.teleprompter{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#0f0f1a;display:none;overflow:hidden;padding:40px 20%}
.teleprompter.active{display:flex;align-items:center}
.t-text{color:#f0f0f5;font-size:26px;line-height:1.7;font-weight:400;text-align:center;animation:scroll 30s linear infinite}
.back{position:fixed;top:20px;left:20px;z-index:30;background:rgba(255,255,255,.1);border:none;color:#f0f0f5;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
</style></head>
<body>
<div class="swiper" id="swiper">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
</div>
<button class="btn" id="tp" onclick="toggleTP()">\u25B6</button>
<div class="teleprompter" id="tp-view">
  <button class="back" onclick="toggleTP()">✕ Done</button>
  <div class="t-text" id="tp-text"></div>
</div>
<script>
const q=[{"text": "Bazen ne yaparsak yapalım işler ters gider, evde sebepsiz bir huzursuzluk başlar, üzerimizde koca bir dağ taşıyormuşuz gibi hissederiz... Kem gözler ve haset, insanın hayatındaki bereketi ve huzuru sessizce çalan en tehlikeli yüktür. Peygamber Efendimiz (s.a.v) rahatsızlandığında, Cebrail (a.s) ona gelerek bizzat şu muazzam şifa ve korunma duasını okumuştur: Okunuşu: \"Bismillâhi erkîke min külli şey'in yü'zîke, min şerri külli nefsin ev 'ayni hâsidin, Allâhü yeşfîke, bismillâhi erkîke.\" Anlamı: \"Allah’ın ismiyle seni rahatsız eden her şeyden sana okurum. Her nefsin veya hasetçi her gözün şerrinden Allah sana şifâ versin. Allah’ın adıyla sana okurum.\" (Müslim) Üzerinde bir ağırlık hissettiğinde, işlerin ters gittiğinde bu ilahi zırhı kuşan ve Allah'ın korumasına sığın. O'nun izniyle bütün ağırlıklar üzerinden kuş gibi kalkacaktır.", "likes": 19}, {"text": "Yetmiş İki Dertten Kurtulma Duâsı Arapçası: لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ وَلَا مَنْجَا مِنَ اللَّهِ إِلَّا إِلَيْهِ Okunuşu: Lâ havle ve lâ kuvvete illâ billâhi ve lâ mencâ minallâhi illâ ileyh. Anlamı: Allah'tan başka güç ve kuvvet sahibi yoktur. Allah'tan yine O'na sığınmaktan başka hiçbir kurtuluş ve kaçış yeri yoktur.", "likes": 8}, {"text": "Bismillahirrahmanirrahim \"Rabbeneftah beynena ve beyne kavmina bil-hakkı ve ente hayrul-fatihîn.\" \"Rabbimiz! Bizimle kavmimiz arasında hak ile hüküm ver. Sen hüküm verenlerin en hayırlısısın.\" A'râf Suresi 89.", "likes": 12}, {"text": "Ömrü Kadar Rızkı rzkBüyüklerden Hatemül Asam hazretleri, bir yolculuğa çıkacaktı. Ailesine: — Ben sefere çıkacağım… Sana ne kadar yiyecek bırakayım, dedi. Hanımı da hakiki mütevekkillerdendi. Kocasına: — Yaşayacağım zamana yetecek kadar rızık isterim, diye cevap verdi. Hatem’ül Asam hazretleri: — Ben senin ne kadar yaşayacağını nereden bilebilirim, deyince de, hanımı: — öyleyse rızkımı ne kadar yaşayacağımı bilene havale et! Yani Allah’a bırak demek istedi. Bunun üzerine Hatemü’l Asam hazretleri, bir şey demeden sefere çıkıp gitti. Bu hali duyan bazı kadınlar, büyük velînin hanımına: — Kocan ne kadar yiyecek bıraktı? diye sormaya başladılar. Mübarek kadın onlara şu cevabı verdi: — Benim kocam rızık vermez, rızık yer… Çünkü rızkı ancak Allah (c.c.) hazretleri verebilir, insanlar bir müktesip sebeptir.", "likes": 11}, {"text": "HER MÜSLÜMAN SADAKA VERMELİDİR “Allah yolunda bir harcamada bulunan kimseye yedi yüz kat sevab yazılır.” (Hadîs-i Şerîf, Sünen-i Nesâî) Peygamber Efendimiz (s.a.v.) buyurdular: “Her Müslüman sadaka vermelidir.” Ashâb-ı Kirâm’dan bir zât: “Şayed bulamazsa ne münâsib görürsünüz?” dedi. Resûlullâh Efendimiz (s.a.v.): “Eliyle iş görür, çalışır. Böylece hem kendine faydalı olur ve hem de sadaka verir.” “Eğer çalışmaya gücü yetmezse ne yapmayı münâsib görürsünüz?” dedi. “Güçlük içindeki ihtiyaç sahibine yardım eder.” buyurdu. “Buna da güç yetiremezse ne yapmayı lâyık görürsünüz?” dedi. Resûlullâh (s.a.v.): “İyiliği -veya hayrı- emreder.” buyurdu. “Eğer bu kadarını da yapamıyacak olursa neyi münâsib görürsünüz?” diye sordu. Peygamber (s.a.v.): “Fenâlık yapmakdan kendini tutar. Bu da bir çeşit sadakadır.” buyurdu. (Buhârî ve Müslim)(Riyazussalihin) Sadaka sadece mala mahsus değildir. Belki her şeyin kendi cinsinden bir sadakası vardır. Mesela; Evin sadakası ondan misafirler için bir oda ayırmak, bedenin sadakası mazluma yardım etmektir. Her iyilik bir sadakadır. Güzel bir söz, fakir ve garip Müslüman’ın gönlünü almak, bunların hepsi birer sadakadır. Resûlullah sallallahü aleyhi ve sellem buyurdular: – Her Müslüman üzerinde her gün bir sadaka vardır. – Yâ Resûlullah buna kimin gücü yeter, dediler. Buyurdu ki: – Yoldan ezâ (veren bir mânia)yı kaldırman sadakadır, Müslümanı yola irşad etmen, yolunu göstermen sadakadır, Müslüman hastayı ziyaret etmen sadakadır, müslümanın cenazesini takib (ve teşyi’) etmen sadakadır, Müslümanın selâmına (ve aleyküm selâm ile) cevap vermen sadakadır. (H. Ş. Müsned-i İbn-i Râhûye) İlim ehlinin sadakası da; ilmi lâyık olana vermek, ilmî meseleleri delilleriyle öğretmek, nasihat etmektir.", "likes": 13}, {"text": "“Allah’ım, acizlikten, tembellikten, cimrilikten, ihtiyarlıktan ve kabir azabından Sana sığınırım. Allah’ım, nefsime takvasını ver ve onu temizle. Onu en iyi temizleyecek olan Sensin. Onun sahibi ve mevlâsı Sensin. Allah’ım, faydasız ilimden, korkmayan kalpten, doymayan nefisten ve kabul olunmayan duadan Sana sığınırım", "likes": 21}, {"text": "Bir kul gözyaslariyla huzuruma af dilemeye gelirse,ben onu affetmemekten haya ederim.\" diyor YARADAN. Affedilenlerden olmak duasiyla", "likes": 13}, {"text": "Kalbi en fazla Nurlandıran şey… Kızdığınız kimseye “Dua” etmektir”", "likes": 16}, {"text": "başkalarından çekindiğin kadar, kendi vicdanından çekin. başkalarından özür dilemeden önce kendinden ve vicdanından özür dile .", "likes": 16}, {"text": "Eklem Ağrıları ve Romatizmaya Manevi Şifa Vesilesi Eklem ağrısı ve romatizma rahatsızlığı çekenlerin istifade edebileceği manevi bir destek ve şifa reçetesi: Nasıl Uygulanır? İnşikak Suresi 7. Ayeti şifa niyetiyle ve abdestli bir şekilde 49 defa okunmaya devam edilir. Niyet: \"Niyet ettim Allah'ım, okuduğum bu ayet-i kerime hürmetine bedenimdeki eklem ve kemik ağrılarına Şafi isminle şifa vermene...\" İnşikak Suresi 7. Ayet (Okunuşu ve Anlamı): \"Fe emmâ men ûtiye kitâbehû bi yemînih.\"", "likes": 12}];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
q.forEach((q,j)=>{
  let s=document.createElement('div');s.className='slide';
  let p=document.createElement('div');p.className='quote';p.textContent=q.text;
  s.appendChild(p);track.appendChild(s);
  let d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
function go(n){
  i=Math.max(0,Math.min(n,q.length-1));
  track.style.transform='translateX(-'+(i*100)+'%)';
  dots.querySelectorAll('.dot').forEach((d,j)=>d.className='dot'+(j===i?' active':''));
  count.textContent=(i+1)+'/'+q.length;
}
go(0);
let sx=0,ex=0,swiping=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiping=true});
document.addEventListener('touchmove',e=>{if(!swiping)return;ex=e.touches[0].clientX});
document.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;let d=sx-ex;if(Math.abs(d)>50)go(d>0?i+1:i-1)});
function toggleTP(){
    let v=document.getElementById('tp-view');
    let s=document.getElementById('swiper');
    let t=document.getElementById('tp-text');
    let b=document.getElementById('tp');
    if(v.classList.contains('active')){
        v.classList.remove('active');s.style.display='';b.textContent='\u25B6'
    }else{
        t.textContent=q[i].text;v.classList.add('active');s.style.display='none';b.textContent='\u23F9'
    }
}
</script>
</body></html>
