<!DOCTYPE html>
<html><head><title>Kadir Basan — Quotes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;font-family:-apple-system,'Helvetica Neue',sans-serif}
.swiper{width:100%;height:100%;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 32px}
.quote{color:#f0f0f5;font-size:22px;line-height:1.6;font-weight:400;text-align:center;max-width:600px;overflow:auto;max-height:100%}
.dots{position:fixed;bottom:60px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#f0f0f5;width:24px;border-radius:4px}
.count{position:fixed;top:50px;right:24px;color:rgba(255,255,255,.25);font-size:14px;font-weight:500;z-index:10}
.btn{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#f0f0f5;font-size:20px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.teleprompter{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#0f0f1a;display:none;overflow:hidden;padding:40px 20%}
.teleprompter.active{display:flex;align-items:center}
.t-text{color:#f0f0f5;font-size:26px;line-height:1.7;font-weight:400;text-align:center;animation:scroll 30s linear infinite}
.back{position:fixed;top:20px;left:20px;z-index:30;background:rgba(255,255,255,.1);border:none;color:#f0f0f5;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer}
</style></head>
<body>
<div class="swiper" id="swiper">
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
</div>
<button class="btn" id="tp" onclick="toggleTP()">\u25B6</button>
<div class="teleprompter" id="tp-view">
  <button class="back" onclick="toggleTP()">✕ Done</button>
  <div class="t-text" id="tp-text"></div>
</div>
<script>
const q=[{"text": "Kalbin daraldığında, zihnin yorulduğunda ve içinden çıkamadığın anlarda bu duayı okuyabilirsin. Lâ ilâhe illallâhü’l-azîmü’l-halîm. Lâ ilâhe illallâhü Rabbü’l-Arşi’l-azîm. Lâ ilâhe illallâhü Rabbü’s-semâvâti ve Rabbü’l-ardı ve Rabbü’l-Arşi’l-kerîm. Rabbim gönlümüze ferahlık, işlerimize kolaylık nasip etsin. Âmin. Duayı kaydet, ihtiyaç duyduğunda yeniden okuyabilmek için yanında olsun.", "likes": 1}, {"text": "akıa Suresi 38. ayette geçen \"Li ashâbi-l yemîn\" (Sağdakiler, iyilik ve bereket ehli için) ifadesi, manevi gelenekte bedensel ve ruhsal dengenin, hücresel esenliğin simgesi kabul edilir. Geleneksel manevi reçetelerde; bağırsaklarda oluşan genel ve geçici ağrı, sızı ile sindirim hassasiyetlerinden arınmak niyetiyle bu ayetin 147 defa okunmasının sindirim sistemine ferahlık ve şifa getireceğine inanılır. Biyolojik Saat, Hormonlar ve Manevi Odak: Hormon Saatleri ve İkinci Beyin: Vücudumuzdaki kortizol, melatonin ve serotonin gibi hormonlar günün belirli saatlerinde yükselip alçalır. \"İkinci beynimiz\" olan bağırsaklar, hormonların gün ve saat içindeki bu değişimlerine doğrudan tepki verir. 147 Defa Tekrar ve Sinir Sistemi: Ritmik olarak 147 defa yapılan odaklanma ve zikir, Vagus siniri aracılığıyla otonom sinir sistemini sakinleştirir. Zihinsel stres azaldıkça bağırsak kaslarındaki gerginlik ve sızılar yatışır. Bütüncül Denge: Tıbbi teşhisleri, beslenme düzenini ve doktor tavsiyelerini aksatmadan; bedenimizin biyolojik ritmine uygun niyetler ve dualarla ruhsal bir destek oluşturmak arınma sürecini tamamlar.", "likes": 4}, {"text": "MAGFİRET DUÂSI Arapça Metin: اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ وَمَا أَسْرَفْتُ وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ لَا إِلٰهَ إِلَّا أَنْتَ Okunuşu: “Allahümmagfirlî mâ kaddemtü ve mâ ehhartü ve mâ esrartü ve mâ a’lentü vemâ esraftü ve mâ ente a’lemü bihî minnî entel mukaddimü ve entel muahhirü lâ ilâhe illâ illâ ente.” Manası: “Allah’ım! Geçmiş ve gelecek, gizli ve açık işlediğim bütün hata ve günahları, senin benden daha iyi bildiklerini de bağışla, ilerleten sensin, gerileten de sensin. Senden başka ilâh yoktur.”", "likes": 4}, {"text": "İDRİS AS. MÜNACAATI (İSMİ AZAM SIRRI VARDIR) YÂ ZE'L-CELÂLİ VE'L-İKRÂM, VE YA ZE'T-TAVLİ VE'L-İN'ÂM, LÂ İLÂHE İLLÂ ENTE ZAHRA'L-LÂCİ'ÎNE VE CÂRÂ'L-MÜSTECÎRÎNE VE EMÂNE'L-HÂİFÎNE VE HIFZA'L-MÜTEVEKKİLÎN.\" يَا ذَا الْجَلَالِ وَالْإِحْرَامِ وَيَا ذَا الطُّولِ وَالْإِنْعَامُ لا إنه إِلَّا أَنتَ ظَهْرَ اللَّاجِئِينَ وجار المستجيرين وَأَمَانَ الخَائِفِينَ وحفظ المتوكلين \"Ey Celâl (büyüklük) ve İkram sahibi, ey nihayetsiz lütuf ve nimet sahibi Allah'ım! Senden başka ilah yoktur; Sen kapına sığınanların dayanağı, yardım dileyenlerin koruyucusu, korku içinde olanların emniyeti ve Sana güvenip tevekkül edenlerin muhafızısın.\" Faziletleri ve Sırları İslam kaynaklarında ve ariflerin tecrübelerinde bu duayı düzenli okumanın şu kapıları açtığı belirtilmiştir: İsm-i Azam Sırrı ve Duaların Kabulü: Duada Allah’ın hem kahrını/azametini (Celâl) hem de şefkatini/rahmetini (İkram, İn'am) barındıran isimler bir aradadır. Bu dengeli zikir kalıbı İsm-i Azam sırrını taşır; duanın başında okunduğunda arkasından istenecek meşru hacetlerin süratle kabul olmasına vesile olur. Korkulardan ve Tehlikelerden Emin Olmak: Hayat kalbini sıkan maddi veya manevi korkulardan (gelecek kaygısı, düşman şerri, iftira, kaza-bela) bunalan kişi bu duaya devam ederse, Allah kalbine \"Emniyet\" (Emâne'l-Hâifîne) indirir. Ağır Borç ve Geçim Sıkıntısının Giderilmesi: \"Ze't-Tavli ve'l-İn'am\" sıfatı Allah'ın kullarına dilediği kadar geniş rızık ve nimet akıtması demektir. Maddi çıkmazda olanlar için bu dua hayırlı rızık kapılarını aralar, berekete vesile olur. Çaresizlik ve Yalnızlık Anında Güçlü Dayanak: Kulun kendini dünyada yalnız, haksızlığa uğramış veya çaresiz hissettiği anlarda bu duayı zikretmesi, ilahi bir zırh vazifesi görür. Allah o kulu haksızlıklara karşı koruması altına alır. Nasıl ve Ne Zaman Okunmalı? Hacet Namazı Sonrası: Gece yarısı veya hacet namazı kıldıktan sonra secdeye vararak ya da elleri açarak 3, 7 veya 21 defa samimiyetle okunması tavsiye edilir.", "likes": 9}, {"text": "Bu müthiş sırra sahip dua, Abdülkadir Geylani Hazretleri’nin aktardığı Besmele Hizbi “Besmele Hizbi” veya “Besmele-i Şerife Duası” olarak bilinir. Bu dua “Bismillahirrahmanirrahim” in ilahi gücünü açığa çıkaran bir manevi anahtardır. Bu tertib, kapalı kapıları açan, dilekleri umulmadık anda gerçekleştiren güçlü bir sırdır. Rızık kapıları açılır, işler kolaylaşır, ruh genişler ve manevi fetihler yaşanır. Abdülkadir Geylani Hazretleri’nin aktardığı bu tertib, bereket, huzur ve ilahi yardımın sırrını taşır. Deneyenler, umulmadık yerlerden gelen rızık ve mucizelerle karşılaşmıştır! Bu sırlı tertib şu şekilde uygulanır: Seher vakti, yani imsakdan 45 dakika önce kalkılır. Abdest alınıp iki rekat namaz kılınır. Ardından, 786 defa Besmele-i Şerife okunur. Sonrasında, 132 defa Salavat-ı Şerife getirilir. Sonra aşağıda ki dua içtenlikle okunur. Duanın sonunda, dileğinizi samimiyetle Allah’a arz edebilirsiniz. “Bismillahirrahmanirrahim. Allahümme inni es’elüke bi hakki bismillahirrahmanirrahim. Ve bi hurmeti bismillahirrahmanirrahim. Ve bi fadli bismillahirrahmanirrahim. Ve bi azameti bismillahirrahmanirrahim. Ve bi celali bismillahirrahmanirrahim. Ve bi cemali bismillahirrahmanirrahim. Ve bi kemali bismillahirrahmanirrahim. Ve bi heybeti bismillahirrahmanirrahim. Ve bi menzileti bismillahirrahmanirrahim. Ve bi melekuti bismillahirrahmanirrahim. Ve bi ceberuti bismillahirrahmanirrahim. Ve bi kerameti bismillahirrahmanirrahim. Ve bi senai bismillahirrahmanirrahim. Ve bi behai bismillahirrahmanirrahim. Ve bi kibriya bismillahirrahmanirrahim. Ve bi sultani bismillahirrahmanirrahim. Ve bi bereketi bismillahirrahmanirrahim. Ve bi izzeti bismillahirrahmanirrahim. Ve bi kuvveti bismillahirrahmanirrahim. Ve bi kudreti bismillahirrahmanirrahim. İrfa’ kadri veşrah sadri ve yessir emri. Verzukni min haysü la yahtesib. Bi fadlike ve keramike ya men hüve kef ha ya ayn sad ha mim ayn sin kaf ve es’elüke bi celalil izzeti ve celalil heybeti ve ceberutil azameti en tec’aleni min ibadikes-salihin ellezine la havfün aleyhi", "likes": 14}, {"text": "Her sabah yeniden başlamayı bilmek lazım umudumuz tazelyerek gülümsereyek ve Allahın izninle iyi şeylerin olacagını inanarah hayata başlamaklazım hayırlı günleriniz olsun.", "likes": 16}, {"text": "Allah'ım; bizlere helalinden, temiz ve bereketli rızık nasip eyle. Kazancımıza bereket, evimize huzur, gönlümüze ferahlık ver. Bizi haramdan uzaklaştır, helalinle yetinmeyi nasip eyle. Âmin. Rızık sadece mal ve para değildir; sağlık, huzur, aile, zaman ve gönül zenginliği de büyük bir nimettir", "likes": 23}, {"text": "Ya Rabbi, bu sabaha Senin rahmetinle uyanmayı, günümüzü Senin rızana uygun yaşamayı nasip eyle. Kalplerimize huzur, işlerimize bereket, yollarımıza hayır ver.* *Yâ Fettâh, hayır kapılarını aç; Yâ Rezzâk, helâl rızıklarla gönüllerimizi ferahlat; Yâ Hafîz, bizi ve sevdiklerimizi her türlü kötülükten muhafaza eyle. Günümüzü günlerin en hayırlılarından eyle.", "likes": 25}, {"text": "İHLASLI OLUNUZ! Her İşinizi Allah Rızası İçin Yapın Dostlarım, ihlaslı olunuz. Her işinizi Allah rızası için yaparsanız kurtulursunuz. İhlassız yapılan amel, üzerinde padişahın mührü bulunmayan sahte para gibidir. Rabbim bütün amellerimizi ihlasla yapmayı ve yalnızca kendi rızasını gözetmeyi nasip eylesin. Amin.", "likes": 17}, {"text": "Bismillahirrahmanirrahim -Vema tevfîkî illâ billâh (Başarım ancak Allah'ın yardımı iledir) ayetini dua niyetine, sayı tutmadan vird şeklinde zikrediyoruz Burada niyetimizi sağlam tutup, bu virdi -herhangi bir adet saymadan, -kalbimize geldiği zaman, -kalbimize geldiği kadar ve, -samimiyet ile yapmamız çok önemli.", "likes": 14}];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
const count=document.getElementById('count');
let i=0;
q.forEach((q,j)=>{
  let s=document.createElement('div');s.className='slide';
  let p=document.createElement('div');p.className='quote';p.textContent=q.text;
  s.appendChild(p);track.appendChild(s);
  let d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
function go(n){
  i=Math.max(0,Math.min(n,q.length-1));
  track.style.transform='translateX(-'+(i*100)+'%)';
  dots.querySelectorAll('.dot').forEach((d,j)=>d.className='dot'+(j===i?' active':''));
  count.textContent=(i+1)+'/'+q.length;
}
go(0);
let sx=0,ex=0,swiping=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiping=true});
document.addEventListener('touchmove',e=>{if(!swiping)return;ex=e.touches[0].clientX});
document.addEventListener('touchend',()=>{if(!swiping)return;swiping=false;let d=sx-ex;if(Math.abs(d)>50)go(d>0?i+1:i-1)});
function toggleTP(){
    let v=document.getElementById('tp-view');
    let s=document.getElementById('swiper');
    let t=document.getElementById('tp-text');
    let b=document.getElementById('tp');
    if(v.classList.contains('active')){
        v.classList.remove('active');s.style.display='';b.textContent='\u25B6'
    }else{
        t.textContent=q[i].text;v.classList.add('active');s.style.display='none';b.textContent='\u23F9'
    }
}
</script>
</body></html>
